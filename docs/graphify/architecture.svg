<text x="48" y="55" class="heading" style="font-size:30px">Coach Learning · Architecture map</text>
<text x="48" y="87" class="body">Local AST graph · 15,837 nodes · 69,674 relationships · 434 communities</text>
<rect x="48" y="140" width="370" height="205" rx="16" fill="#dbeafe" stroke="#334155"/><text x="70" y="174" class="heading">Frontend · Next.js / React</text><text x="70" y="205" class="body">Student / Teacher / Parent views</text><text x="70" y="230" class="body">API client + Next route proxies</text><text x="70" y="255" class="body">Browser OCR / ONNX</text><text x="70" y="280" class="body">Math Canvas / Three.js</text>
<rect x="540" y="140" width="420" height="205" rx="16" fill="#dcfce7" stroke="#334155"/><text x="562" y="174" class="heading">Backend · FastAPI</text><text x="562" y="205" class="body">Root API + /api/v2 + /api/v3</text><text x="562" y="230" class="body">Practice / Assignments / Mastery</text><text x="562" y="255" class="body">Recommendations / Curriculum</text><text x="562" y="280" class="body">Math solutions / Paper / Canvas</text>
<rect x="540" y="440" width="420" height="205" rx="16" fill="#ede9fe" stroke="#334155"/><text x="562" y="474" class="heading">AI · modules inside Backend</text><text x="562" y="505" class="body">AIGateway · routing / validator / policy</text><text x="562" y="530" class="body">Tutor / RAG / EmbeddingService</text><text x="562" y="555" class="body">Paper OCR: direct Gemini HTTP</text><text x="562" y="580" class="body">External provider or local Mock</text>
<rect x="1080" y="140" width="312" height="145" rx="16" fill="#fef3c7" stroke="#334155"/><text x="1102" y="174" class="heading">Persistence</text><text x="1102" y="205" class="body">PostgreSQL + pgvector</text><text x="1102" y="230" class="body">SQLAlchemy / Alembic</text>
<rect x="1080" y="440" width="312" height="145" rx="16" fill="#fce7f3" stroke="#334155"/><text x="1102" y="474" class="heading">AI provider</text><text x="1102" y="505" class="body">Gemini API</text><text x="1102" y="530" class="body">Mock provider (local)</text>
<rect x="48" y="440" width="370" height="205" rx="16" fill="#e2e8f0" stroke="#334155"/><text x="70" y="474" class="heading">Offline development tools</text><text x="70" y="505" class="body">PDF extraction / OCR pipeline</text><text x="70" y="530" class="body">learning_baseline / B3 scheduler</text><text x="70" y="555" class="body">Produces local artifacts</text><text x="70" y="580" class="body">No automatic runtime integration</text>
