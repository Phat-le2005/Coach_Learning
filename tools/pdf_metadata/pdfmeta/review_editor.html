<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Learning · Duyệt dữ liệu PDF</title>
<link rel="stylesheet" href="review-assets/katex/katex.min.css"><script defer src="review-assets/katex/katex.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#203c46;background:#f0f4f5;color-scheme:light}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}header{height:88px;padding:17px 24px;background:white;border-bottom:1px solid #dbe5e6;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0 0 4px;font-size:21px}header p{margin:0;color:#6a828b;font-size:12px}.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid #cbdcde;border-radius:8px;padding:9px 12px;color:#28535b;background:white;font-size:12px}.btn.primary{background:#117c65;color:white;border-color:#117c65}.btn.warning{background:#fff7e4;color:#825d14;border-color:#e9d49e}.layout{display:grid;grid-template-columns:225px minmax(0,1fr);height:calc(100vh - 88px)}aside{padding:17px;background:#f9fbfb;border-right:1px solid #dbe5e6;overflow:auto}input,select,textarea{border:1px solid #ccdcdf;border-radius:7px;background:white;color:#29434d;padding:9px;width:100%;font-size:13px}aside input,aside select{margin-bottom:10px}.muted{font-size:12px;color:#70858c;line-height:1.6}.item{width:100%;text-align:left;border:1px solid #dce6e7;border-radius:9px;padding:10px;background:white;margin-top:7px;color:#294a54}.item.active{border-color:#11836a;background:#eaf7f1}.item small{display:block;font-size:10px;color:#758a90;margin-top:4px}.pill{font-size:10px;padding:3px 6px;background:#edf3f3;color:#617c82;border-radius:5px;display:inline-block}.pill.ok{background:#dff5eb;color:#136e54}.pill.warn{background:#fff0cf;color:#8c6417}main{overflow:auto;padding:21px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px}h2{font-size:23px;margin:0 0 5px}.columns{display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,1fr);gap:18px;align-items:start}.card{background:white;border:1px solid #dbe6e7;border-radius:11px;overflow:hidden;margin-bottom:17px}.card h3{font-size:13px;margin:0;padding:13px 16px;border-bottom:1px solid #e1eaea;background:#f8fbfa}.content{padding:15px}.content>label{display:block;font-size:12px;font-weight:600;margin:13px 0 6px}.content>label:first-child{margin-top:0}textarea{min-height:95px;resize:vertical;line-height:1.6}.formula-edit{font:13px/1.7 Consolas,monospace;min-height:85px}.source-img{max-width:100%;height:auto;display:block;margin:9px auto 17px;border:1px solid #e8eeee}a{color:#11816a}.preview{padding:12px;background:#f7faf9;border:1px solid #e4edeb;border-radius:7px;margin-top:7px;line-height:1.85;overflow:auto;font-size:13px;overflow-wrap:anywhere}.preview .katex-display{margin:.5em 0}.check{display:flex;align-items:start;gap:8px;font-size:12px;font-weight:400!important;margin:10px 0!important}.check input{width:auto;margin-top:3px}.notice{font-size:12px;line-height:1.7;border:1px solid #ead7a6;background:#fff8e9;color:#825f18;padding:11px;border-radius:8px;margin-bottom:12px}.message{padding:10px 12px;border-radius:7px;font-size:12px;background:#e8f5ef;color:#25634f;white-space:pre-wrap;margin-top:10px}.message.error{background:#fff0ed;color:#9d4233}details{margin-top:12px}summary{cursor:pointer;font-size:12px;color:#5c7b83}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 Consolas,monospace;background:#f7f9fa;padding:12px;border-radius:7px}.crop{width:100%;max-height:200px;object-fit:contain;display:block;background:#fff;border:1px solid #e5ecec;margin:10px 0}.savebar{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.sticky{position:sticky;top:0}.issue{border-left:3px solid #d49b37;padding:8px 10px;background:#fff9ef;font-size:12px;line-height:1.7;margin-bottom:8px}.kbd{font-size:10px;color:#778e95}.section-note{font-size:11px;color:#69858b;margin:6px 0}.inline-checks{margin-top:12px;padding-top:5px;border-top:1px solid #e6eeee}@media(max-width:1100px){.columns{grid-template-columns:1fr}.sticky{position:static}}@media(max-width:650px){header{height:auto;display:block;padding:16px}.actions{margin-top:12px;flex-wrap:wrap}.layout{display:block;height:auto}aside{max-height:220px}main{overflow:visible;padding:14px}.columns{display:block}}
</style></head><body>
<header><div><h1>Duyệt dữ liệu PDF</h1><p>Đối chiếu nguồn · Biên soạn công thức · Lưu phiên bản</p></div><div class="actions"><span class="pill warn">Dữ liệu biên soạn · Chưa dùng để chấm</span><a class="btn" href="exports/pilot20.authoring.pretty.json" target="_blank" rel="noopener">JSON dễ đọc</a><button class="btn" id="export">Xuất bộ 20 bài</button></div></header>
<div class="layout"><aside><input id="search" placeholder="Tìm câu / nội dung" aria-label="Tìm câu"><select id="filter" aria-label="Lọc danh sách"><option value="batch">Bộ 20 bài mẫu</option><option value="all">Tất cả câu</option><option value="issues">Có ghi chú cần kiểm tra</option><option value="verified">Đã đối chiếu đề/đáp án</option></select><div id="stats" class="muted"></div><nav id="list"></nav></aside><main id="main"></main></div>
<script id="data" type="application/json">__PAYLOAD__</script>
<script id="review-config" type="application/json">{"writable":false}</script>
<script>
const {items,report,curation,page_sizes,step_review_available}=JSON.parse(document.querySelector('#data').textContent);
const config=JSON.parse(document.querySelector('#review-config').textContent);
const curated=new Map((curation?.items||[]).map(x=>[x.number,x]));
const itemById=new Map(items.map(x=>[x.question_id,x]));
let selected=items.find(x=>curated.has(x.source_number))?.question_id||items[0]?.question_id;
let reviews={},drafts=new Map(),dirty=new Set(),busy=false;
const labels={DRAFT:'Bản nháp',NEEDS_REVIEW:'Cần kiểm tra',SOURCE_VERIFIED:'Đề/đáp án đã đối chiếu'};
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function card(title){const c=el('section','card'),b=el('div','content');c.append(el('h3','',title),b);return[c,b]}
function renderMath(target,text,formula=false){target.replaceChildren();if(formula){try{if(window.katex){katex.render(text.replace(/^\s*\$+|\$+\s*$/g,''),target,{throwOnError:false,trust:false,strict:'warn',maxExpand:500,maxSize:12,displayMode:true});return}}catch(e){}target.textContent=text;return}const rx=/\$\$([\s\S]*?)\$\$|\$([^$\n]+)\$/g;let cursor=0,m;while((m=rx.exec(text))){target.append(document.createTextNode(text.slice(cursor,m.index)));const span=el('span');if(window.katex){try{katex.render(m[1]??m[2],span,{throwOnError:false,trust:false,strict:'warn',maxExpand:500,maxSize:12,displayMode:m[1]!==undefined})}catch(e){span.textContent=m[0]}}else span.textContent=m[0];target.append(span);cursor=rx.lastIndex}target.append(document.createTextNode(text.slice(cursor)));target.style.whiteSpace='pre-wrap'}
function sourceImages(body,part){for(const s of part.source_spans){const a=el('a','muted',`Trang ${s.page_number} · mở nguồn`);a.href=`pages/page-${String(s.page_number).padStart(3,'0')}.png`;a.target='_blank';a.rel='noopener';body.append(a);if(s.asset_path){const image=el('img','source-img');image.src=s.asset_path;image.alt=`Ảnh nguồn trang ${s.page_number}`;image.loading='lazy';body.append(image)}}}
function initialDraft(item){if(drafts.has(item.question_id))return drafts.get(item.question_id);const saved=reviews[item.question_id],c=curated.get(item.source_number);const draft={fields:saved&&!saved.stale?structuredClone(saved.fields):{stem_markdown:c?.stem_markdown||item.stem.text_raw,answer_text:c?.expected_source_answer||(item.answer.text_raw||'').replace(/\s*\.\s*$/,''),solution_markdown:'',formula_corrections:[]},field_checks:saved&&!saved.stale?{...saved.field_checks}:{stem:false,answer:false,solution:false},reviewer:saved?.reviewer||'',note:saved?.note||'',revision:saved?.revision||0,formula_id:null};drafts.set(item.question_id,draft);return draft}
function visible(item){if(!item)return false;const filter=document.querySelector('#filter').value,q=document.querySelector('#search').value.toLocaleLowerCase('vi');if(filter==='batch'&&!curated.has(item.source_number))return false;if(filter==='issues'&&!curated.get(item.source_number)?.issues?.length&&!report.ocr_quality_findings?.some(f=>f.question_id===item.question_id))return false;if(filter==='verified'&&reviews[item.question_id]?.status!=='SOURCE_VERIFIED')return false;return `${item.source_number} ${item.stem.text_raw} ${curated.get(item.source_number)?.topic||''}`.toLocaleLowerCase('vi').includes(q)}
function drawList(){document.querySelector('#export').disabled=!config.writable||dirty.size>0;const list=document.querySelector('#list');list.replaceChildren();for(const item of items.filter(visible)){const saved=reviews[item.question_id],b=el('button',`item${selected===item.question_id?' active':''}`,`Câu ${item.source_number}${dirty.has(item.question_id)?' •':''}`);b.append(el('small','',curated.get(item.source_number)?.topic||`Trang ${[...new Set(item.source_regions.map(s=>s.page_number))].join(', ')}`));b.append(el('span',`pill${saved?.status==='SOURCE_VERIFIED'&&!saved.stale?' ok':''}`,saved?.stale?'Cần đối chiếu lại':labels[saved?.status]||'Chưa lưu'));b.onclick=()=>{selected=item.question_id;draw()};list.append(b)}const verified=Object.values(reviews).filter(x=>x.status==='SOURCE_VERIFIED'&&!x.stale).length;document.querySelector('#stats').textContent=`${items.length} câu · ${curated.size} bài mẫu · ${verified} đã đối chiếu`}
function markDirty(id){dirty.add(id);drawList();const d=drafts.get(id);document.querySelectorAll('[data-check]').forEach(n=>n.checked=d.field_checks[n.dataset.check]);const label=document.querySelector('#save-message');if(label){label.className='message';label.textContent='Có thay đổi chưa lưu.'}}
function inputField(body,label,value,change,rows=4){body.append(el('label','',label));const t=el('textarea');t.id=label.startsWith('Đề bài')?'edit-stem':'edit-solution';body.lastChild.htmlFor=t.id;t.value=value;t.rows=rows;const p=el('div','preview');renderMath(p,value);t.oninput=()=>{change(t.value);renderMath(p,t.value);markDirty(selected)};body.append(t,p);return t}
function draw(){drawList();const main=document.querySelector('#main');main.replaceChildren();const item=itemById.get(selected);if(!item)return;const draft=initialDraft(item),saved=reviews[selected],c=curated.get(item.source_number);const heading=el('div','heading'),title=el('div');title.append(el('h2','',`Câu ${item.source_number}`),el('div','muted',c?.topic||'Dữ liệu trích xuất'));heading.append(title,el('span','pill warn','Duyệt nguồn khác với duyệt học thuật'));if(step_review_available){const stepLink=el('a','btn', 'Xem các bước giải');stepLink.href=`steps.html?question=${item.source_number}`;heading.append(stepLink)}main.append(heading);if(!config.writable)main.append(el('div','notice','Đang mở bản chỉ đọc. Dùng server review tại localhost:8787 để lưu chỉnh sửa.'));if(saved?.stale)main.append(el('div','notice','Metadata nguồn đã thay đổi từ lần lưu trước. Nội dung cần được đối chiếu lại.'));const cols=el('div','columns'),left=el('div'),right=el('div');cols.append(left,right);main.append(cols);
for(const[key,label]of[['stem','Đề bài trong nguồn'],['answer','Đáp án ghi trong nguồn'],['solution','Lời giải trong nguồn']]){const[box,b]=card(label);sourceImages(b,item[key]);left.append(box)}
const[issues,ib]=card('Điểm cần chú ý');if(c?.issues?.length){for(const issue of c.issues)ib.append(el('div','issue',issue.note))}else ib.append(el('p','muted','Chưa có ghi chú học thuật riêng. Vẫn cần đối chiếu công thức và nội dung với nguồn.'));const n=report.ocr_quality_findings?.filter(f=>f.question_id===selected).length||0;ib.append(el('p','section-note',`${n} cảnh báo từ các phiên bản OCR. Cảnh báo có thể gồm báo nhầm; không tự kết luận đáp án sai.`));right.append(issues);
const[editor,eb]=card('Bản biên soạn');inputField(eb,'Đề bài · dùng $...$ để viết công thức',draft.fields.stem_markdown,v=>{draft.fields.stem_markdown=v;draft.field_checks.stem=false},5);eb.append(el('label','','Đáp án biên soạn'));const answer=el('input');answer.id='edit-answer';eb.lastChild.htmlFor=answer.id;answer.value=draft.fields.answer_text;answer.oninput=()=>{draft.fields.answer_text=answer.value;draft.field_checks.answer=false;markDirty(selected)};eb.append(answer);inputField(eb,'Lời giải biên soạn · để trống nếu chưa kiểm tra',draft.fields.solution_markdown,v=>{draft.fields.solution_markdown=v;draft.field_checks.solution=false},5);right.append(editor);
if(item.ocr_evidence?.length){const[formula,fb]=card('Đối chiếu từng vùng công thức');const selector=el('select');const evidence=[...item.ocr_evidence].sort((a,b)=>Number(b.parser_id.endsWith('-M'))-Number(a.parser_id.endsWith('-M')));for(const block of evidence){const option=el('option','',`${block.parser_id} · trang ${block.page_number} · ${block.block_id}`);option.value=block.block_id;selector.append(option)}fb.append(selector);const crop=el('canvas','crop'),latex=el('textarea','formula-edit'),preview=el('div','preview');fb.append(crop,latex,preview);const hint=el('p','section-note','Sửa tại đây rồi bấm Lưu bản nháp. Bản OCR gốc vẫn được giữ.');fb.append(hint);function showFormula(){const block=evidence.find(x=>x.block_id===selector.value);draft.formula_id=block.block_id;latex.value=draft.fields.formula_corrections.find(x=>x.block_id===block.block_id)?.latex??block.text_raw;renderMath(preview,latex.value,true);const image=new Image();image.onload=()=>{if(selector.value!==block.block_id)return;const size=page_sizes[String(block.page_number)],b=block.bbox;const sx=image.width/size[0],sy=image.height/size[1];crop.width=Math.max(1,Math.ceil((b[2]-b[0])*sx));crop.height=Math.max(1,Math.ceil((b[3]-b[1])*sy));crop.getContext('2d').drawImage(image,b[0]*sx,b[1]*sy,(b[2]-b[0])*sx,(b[3]-b[1])*sy,0,0,crop.width,crop.height)};image.src=`pages/page-${String(block.page_number).padStart(3,'0')}.png`}selector.value=draft.formula_id||evidence[0].block_id;selector.onchange=showFormula;latex.setAttribute('aria-label','LaTeX vùng công thức');selector.setAttribute('aria-label','Vùng công thức');latex.oninput=()=>{draft.field_checks.stem=false;draft.field_checks.solution=false;draft.fields.formula_corrections=draft.fields.formula_corrections.filter(x=>x.block_id!==selector.value);draft.fields.formula_corrections.push({block_id:selector.value,latex:latex.value});renderMath(preview,latex.value,true);markDirty(selected)};showFormula();right.append(formula)}
const[save,sb]=card('Lưu đối chiếu nguồn');sb.append(el('label','','Người biên soạn / nhãn người duyệt'));const reviewer=el('input');reviewer.id='edit-reviewer';sb.lastChild.htmlFor=reviewer.id;reviewer.placeholder='Ví dụ: Phúc';reviewer.value=draft.reviewer;reviewer.oninput=()=>{draft.reviewer=reviewer.value;markDirty(selected)};sb.append(reviewer);const checks=el('div','inline-checks');for(const[key,text]of[['stem','Đã đối chiếu đề và công thức với ảnh nguồn'],['answer','Đã đối chiếu đáp án ghi trong nguồn'],['solution','Đã đối chiếu lời giải biên soạn']]){const label=el('label','check'),input=el('input');input.type='checkbox';input.dataset.check=key;input.checked=draft.field_checks[key];input.onchange=()=>{draft.field_checks[key]=input.checked;markDirty(selected)};label.append(input,document.createTextNode(text));checks.append(label)}sb.append(checks);sb.append(el('label','','Ghi chú'));const note=el('textarea');note.id='edit-note';sb.lastChild.htmlFor=note.id;note.rows=3;note.value=draft.note;note.oninput=()=>{draft.note=note.value;markDirty(selected)};sb.append(note);const buttons=el('div','savebar');for(const[status,label,cls]of[['DRAFT','Lưu bản nháp','btn'],['NEEDS_REVIEW','Cần kiểm tra','btn warning'],['SOURCE_VERIFIED','Đề/đáp án đã đối chiếu','btn primary']]){const button=el('button',cls,label);button.disabled=!config.writable||busy;button.onclick=()=>saveItem(status);buttons.append(button)}const reload=el('button','btn','Nạp bản đã lưu');reload.disabled=!config.writable;reload.onclick=async()=>{if(dirty.has(selected)&&!confirm('Nạp bản đã lưu sẽ thay bản nháp đang sửa của câu này. Tiếp tục?'))return;await loadState();drafts.delete(selected);dirty.delete(selected);draw()};buttons.append(reload);sb.append(buttons,el('p','section-note','Xác nhận đề/đáp án chỉ ghi nhận đã đối chiếu nguồn. Trạng thái học thuật và quyền chấm vẫn chờ kiểm tra.'));const message=el('div','message');message.id='save-message';message.textContent=dirty.has(selected)?'Có thay đổi chưa lưu.':saved?`Đã lưu phiên bản ${saved.revision}.`:'Chưa có bản chỉnh sửa được lưu.';sb.append(message);right.append(save);const[raw,rb]=card('Dữ liệu nguồn và nhóm bước ứng viên');const details=el('details');details.append(el('summary','','Xem chữ trích xuất thô (có thể lỗi font)'),el('pre','',item.stem.text_raw+'\n\n'+item.solution.text_raw));rb.append(details,el('p','muted',`${item.reference_steps.length} nhóm bước ứng viên; chưa là rubric đã duyệt.`));right.append(raw);main.scrollTop=0}
async function loadState(){const r=await fetch('/api/review/state',{cache:'no-store'});if(!r.ok)throw new Error('Không đọc được bản lưu');const state=await r.json();reviews=state.reviews}
async function saveItem(status){if(busy)return;const id=selected,draft=drafts.get(id),message=document.querySelector('#save-message');busy=true;try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify({question_id:id,expected_revision:draft.revision,status,fields:draft.fields,field_checks:draft.field_checks,reviewer:draft.reviewer,note:draft.note})});const data=await r.json();if(!r.ok)throw new Error(data.error);reviews[id]=data.review;draft.revision=data.review.revision;dirty.delete(id);busy=false;draw();document.querySelector('#save-message').textContent=`Đã lưu phiên bản ${data.review.revision}. Nội dung còn nguyên sau khi tải lại trang.`}catch(e){message.className='message error';message.textContent=e.message}finally{busy=false}}
document.querySelector('#search').oninput=drawList;document.querySelector('#filter').onchange=()=>{if(!visible(itemById.get(selected))){const first=items.find(visible);if(first)selected=first.question_id}draw()};document.querySelector('#export').disabled=!config.writable;document.querySelector('#export').onclick=async()=>{try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:'{}'});const data=await r.json();if(!r.ok)throw new Error(data.error);alert(`Đã xuất ${data.batch_size} bài vào exports/pilot20.authoring.jsonl. Đây là dữ liệu biên soạn, chưa phát hành để chấm.`)}catch(e){alert(e.message)}};window.addEventListener('beforeunload',event=>{if(dirty.size){event.preventDefault();event.returnValue=''}});
window.addEventListener('load',async()=>{if(config.writable){try{await loadState()}catch(e){config.writable=false}}draw()});
</script></body></html>
