<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Learning · Tách bước lời giải</title>
<link rel="stylesheet" href="review-assets/katex/katex.min.css"><script defer src="review-assets/katex/katex.min.js"></script>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#253f49;background:#f0f5f4}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;background:white;border-bottom:1px solid #d8e5e1;display:flex;justify-content:space-between;gap:18px;align-items:center}h1{font-size:21px;margin:0 0 5px}p{line-height:1.65}header p{font-size:12px;color:#6a807e;margin:0}a{color:#117960}button,select,input{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:205px minmax(0,1fr);height:calc(100vh - 90px)}aside{padding:18px;overflow:auto;border-right:1px solid #dae6e2}aside input{padding:9px;width:100%;border:1px solid #cbded6;border-radius:8px;margin-bottom:12px}.q{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid #d8e5e0;border-radius:8px;background:white;color:#314f51;margin:6px 0}.q.active{background:#e1f4eb;border-color:#168469}.q small{display:block;font-size:10px;color:#64847c;margin-top:3px}main{overflow:auto;padding:25px;scroll-behavior:smooth}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h2{margin:0;font-size:25px}.badge{font-size:11px;padding:6px 9px;border-radius:6px;background:#fff1d8;color:#8b631d}.notice{font-size:12px;color:#76602e;padding:12px 15px;background:#fff9ed;border:1px solid #ebddbd;border-radius:9px;margin:16px 0}.summary{font-size:13px;color:#5b7973}.steps{display:grid;gap:16px}.step{background:white;border:1px solid #d9e7e0;border-radius:12px;overflow:hidden}.step-head{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#f8fbf9;border-bottom:1px solid #e4ece8}.number{display:grid;place-items:center;background:#147b61;color:white;width:30px;height:30px;border-radius:50%;flex-shrink:0}.step h3{font-size:14px;margin:0}.kind{font:10px Consolas,monospace;color:#6f8582;margin-top:4px}.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:18px}.caption{font-size:11px;color:#648079;margin:0 0 8px}.excerpt{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.8 Consolas,monospace;background:#f6f9f7;padding:12px;border-radius:8px;margin:0}.formula{overflow:auto;padding:12px;border:1px solid #dceae4;border-radius:8px;background:#fbfdfb;margin-top:8px}.formula .katex-display{margin:.4em 0}.formula-label{font-size:10px;color:#718b80}canvas{display:block;max-width:100%;height:auto;border:1px solid #e2eae7;background:white;margin:6px 0 12px}.source{font-size:11px}.foot{font-size:11px;color:#71867f;padding:0 18px 14px}.more{font-size:11px;color:#728b81;margin-top:10px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.jump{font-size:11px;border:1px solid #cce0d6;background:white;color:#30614f;border-radius:6px;padding:7px 10px}.links{display:flex;gap:14px;font-size:12px}@media(max-width:1000px){.body{grid-template-columns:1fr}}@media(max-width:650px){header{display:block;padding:16px}.links{margin-top:10px}.layout{display:block;height:auto}aside{max-height:220px}main{padding:14px;overflow:visible}.top{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>Tách bước lời giải</h1><p>Mỗi ý suy luận có phần chữ, công thức ứng viên và ảnh nguồn để đối chiếu.</p></div><div class="links"><a href="review.html">Về trang biên soạn</a><a href="steps/questions.steps.pretty.json" target="_blank" rel="noopener">Mở metadata</a></div></header>
<div class="layout"><aside><input id="search" aria-label="Tìm câu" placeholder="Tìm số câu…"><div id="list"></div></aside><main id="main"></main></div>
<script id="data" type="application/json">__PAYLOAD__</script><script>
const {records,report,page_sizes}=JSON.parse(document.querySelector('#data').textContent);
let selected=records.find(r=>r.source_number===Number(new URLSearchParams(location.search).get('question')))?.question_id||records[0]?.question_id;
const images=new Map();let revisionWarning="";
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function pageImage(n){if(!images.has(n)){const img=new Image();images.set(n,new Promise((resolve,reject)=>{img.onload=()=>resolve(img);img.onerror=reject}));img.src=`pages/page-${String(n).padStart(3,'0')}.png`}return images.get(n)}
function crop(target,span){const link=el('a','source',`Trang ${span.page_number} · mở ảnh đầy đủ`);link.href=`pages/page-${String(span.page_number).padStart(3,'0')}.png`;link.target='_blank';link.rel='noopener';const canvas=el('canvas');canvas.setAttribute('aria-label',`Vùng nguồn trang ${span.page_number}`);target.append(link,canvas);pageImage(span.page_number).then(img=>{const [w,h]=page_sizes[String(span.page_number)],b=span.bbox,sx=img.width/w,sy=img.height/h;canvas.width=Math.max(1,Math.ceil((b[2]-b[0])*sx));canvas.height=Math.max(1,Math.ceil((b[3]-b[1])*sy));canvas.getContext('2d').drawImage(img,b[0]*sx,b[1]*sy,(b[2]-b[0])*sx,(b[3]-b[1])*sy,0,0,canvas.width,canvas.height)}).catch(()=>target.append(el('p','','Không đọc được ảnh nguồn.')))}
function formula(target,c){target.append(el('div','formula-label',`${c.parser_id} · công thức ứng viên cần đối chiếu`));const box=el('div','formula');try{if(window.katex)katex.render(c.latex,box,{throwOnError:false,trust:false,maxExpand:500,maxSize:12,displayMode:true});else box.textContent=c.latex}catch(e){box.textContent=c.latex}target.append(box)}
function drawList(){const list=document.querySelector('#list'),q=document.querySelector('#search').value;list.replaceChildren();for(const r of records.filter(r=>String(r.source_number).includes(q))){const b=el('button',`q${r.question_id===selected?' active':''}`,`Câu ${r.source_number}`);b.append(el('small','',`${r.legacy_group_count} nhóm cũ → ${r.steps.length} bước đề xuất`));b.onclick=()=>{selected=r.question_id;history.replaceState(null,'',`?question=${r.source_number}`);draw()};list.append(b)}}
function draw(){drawList();const r=records.find(x=>x.question_id===selected),main=document.querySelector('#main');main.replaceChildren();if(!r)return;const top=el('div','top');top.append(el('h2','',`Câu ${r.source_number}`),el('span','badge','Bước đề xuất · Chưa duyệt để chấm'));if(revisionWarning)main.append(el('p','notice',revisionWarning));main.append(top,el('p','summary',`${r.legacy_group_count} nhóm trích đoạn cũ → ${r.steps.length} bước đề xuất. Mũi tên thể hiện thứ tự trình bày; quan hệ suy luận cần người duyệt kiểm tra.`),el('p','notice','Chữ trích xuất còn mất bố cục phân số, số mũ. Hãy đối chiếu ảnh và các bản công thức. Bảng biến thiên và giả thiết về dấu tham số cần kiểm tra riêng.'));for(const note of r.source_review_notes||[])main.append(el('p','notice',note.note));if(r.review_flags.length)main.append(el('p','notice',`Có cảnh báo nguồn: ${r.review_flags.join(', ')}`));const nav=el('nav'),steps=el('div','steps');main.append(nav,steps);r.steps.forEach((s,i)=>{const jump=el('button','jump',`Bước ${i+1}`);jump.onclick=()=>document.getElementById(`step-${i}`).scrollIntoView({block:'start',behavior:'smooth'});nav.append(jump);const card=el('section','step');card.id=`step-${i}`;const head=el('div','step-head'),title=el('div');title.append(el('h3','',s.title),el('div','kind',s.kind_candidate));head.append(el('span','number',i+1),title);const body=el('div','body'),text=el('div'),source=el('div');const native=el('details','more');native.append(el('summary','','Xem chữ nguồn đã đổi font (còn mất bố cục toán)'),el('pre','excerpt',s.text_candidate));if(s.latex_candidates.length){formula(text,s.latex_candidates[0]);if(s.latex_candidates.length>1){const more=el('details','more');more.append(el('summary','',`Xem ${s.latex_candidates.length-1} bản nhận dạng khác`));s.latex_candidates.slice(1).forEach(c=>formula(more,c));text.append(more)}text.append(native)}else{text.append(el('p','caption','CHỮ NGUỒN ĐÃ ĐỔI FONT · CÒN MẤT BỐ CỤC TOÁN'),el('pre','excerpt',s.text_candidate))}if(s.conditions_candidate.length)text.append(el('p','caption',`Điều kiện ghi trong đoạn: ${s.conditions_candidate.map(c=>c.text).join('; ')}`));source.append(el('p','caption','ẢNH NGUỒN · GIỮ CẢ BẢNG / HÌNH VÀ PHẦN QUA TRANG'));s.context_spans.forEach(span=>crop(source,span));body.append(text,source);card.append(head,body,el('div','foot',s.review_flags.includes('SHARED_SOURCE_LINE_SPLIT')?'Hai ý nằm chung một dòng nguồn nên ảnh đối chiếu có thể lặp; nội dung bước được tách riêng.':s.kind_candidate==='SIGN_TABLE'?'Bảng được giữ bằng ảnh. Nội dung bảng và điều kiện áp dụng chưa được xác minh tự động.':'Có vị trí trang và khối chữ gốc. Công thức, ý nghĩa và tiêu chí chấm vẫn chờ duyệt.'));steps.append(card)});main.scrollTop=0}
async function checkRevision(){try{const response=await fetch('/api/review/state',{cache:'no-store'});if(!response.ok)throw new Error('unavailable');const state=await response.json();if(records.some(r=>r.candidate_generation!==state.base_generation||r.review_document_revision!==state.document_revision))revisionWarning='Nguồn hoặc bản sửa công thức đã thay đổi. Chạy lại bước steps để tạo đề xuất mới trước khi đối chiếu.'}catch(e){revisionWarning='Chưa kiểm tra được phiên bản hiện tại trên server review. Bản này chỉ là ảnh chụp dữ liệu lúc tạo.'}if(revisionWarning)document.querySelector('#main').prepend(el('p','notice',revisionWarning))}
document.querySelector('#search').oninput=drawList;document.addEventListener('DOMContentLoaded',()=>{draw();checkRevision()});
</script></body></html>
