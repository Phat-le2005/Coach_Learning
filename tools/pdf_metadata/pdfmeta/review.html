<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach Learning · PDF Metadata Pilot</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#203b46;background:#eef3f5}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#fff;border-bottom:1px solid #dae5e8;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#64808a;font-size:13px}.badge{padding:9px 13px;background:#fff5de;color:#825a0b;border:1px solid #ead5a3;border-radius:8px;font-size:12px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh - 92px)}aside{background:#f9fbfc;border-right:1px solid #dae5e8;padding:18px;overflow:auto}input{width:100%;padding:10px;border:1px solid #cadade;border-radius:8px;background:white;margin-bottom:12px}button{cursor:pointer;font:inherit}.item{display:block;width:100%;text-align:left;border:1px solid #dbe6e8;border-radius:9px;background:#fff;margin-bottom:8px;padding:11px;color:#284550}.item.active{border-color:#13836c;background:#edf8f3}.item small{display:block;color:#788b93;font-size:11px;margin-top:4px}main{overflow:auto;padding:24px;max-width:1500px;width:100%;margin:auto;height:100%}.heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}h2{font-size:22px;margin:0 0 6px}.muted{color:#68818b;font-size:12px}.columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,1fr);gap:18px}.card{border:1px solid #dae5e8;border-radius:12px;background:#fff;margin-bottom:18px;overflow:hidden}.card h3{font-size:14px;padding:14px 18px;background:#f8fbfa;border-bottom:1px solid #e1ebe8;margin:0}.content{padding:16px 18px}img{display:block;max-width:100%;height:auto;margin:8px auto 18px;border:1px solid #e5ebed}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 "Segoe UI",sans-serif;background:#f7f9fa;padding:13px;border-radius:8px;margin:0}.flag{display:inline-block;font-size:10px;border:1px solid #e7d5a5;color:#8a6514;background:#fff9e9;padding:4px 6px;margin:0 5px 6px 0;border-radius:5px}.step{border-top:1px solid #e5ecee;padding:13px 0}.step:first-child{border:0}.step strong{font-size:12px;color:#16715d}a{color:#087e69}details{margin-top:12px}summary{cursor:pointer;font-size:12px;color:#537480}.empty{padding:24px;background:#fff5de;border-radius:10px}@media(max-width:950px){.columns{grid-template-columns:1fr}.layout{grid-template-columns:170px 1fr}main{padding:14px}header{padding:16px}}@media(max-width:600px){.layout{display:block;height:auto}aside{max-height:180px}main{height:auto}.heading{align-items:flex-start}header{display:block}.badge{margin-top:12px;display:inline-block}}
</style>
<header><div><h1>PDF → Metadata</h1><p>Coach Learning · Đối chiếu dữ liệu với ảnh nguồn</p></div><div class="badge">Dữ liệu ứng viên · Chưa phát hành để chấm</div></header>
<div class="layout"><aside><input id="search" placeholder="Tìm số câu / nội dung" aria-label="Tìm câu"><div id="stats" class="muted"></div><br><nav id="list"></nav></aside><main id="main"></main></div>
<script id="data" type="application/json">__PAYLOAD__</script>
<script>
const {items,report}=JSON.parse(document.querySelector('#data').textContent);let selected=0;
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
document.querySelector('#stats').textContent=`${report.page_count} trang · ${items.length} câu ứng viên`;
function card(title){const c=el('section','card');c.append(el('h3','',title));const b=el('div','content');c.append(b);return[c,b]}
function sources(body,part){for(const s of part.source_spans){const link=el('a','muted',`Trang ${s.page_number} · xem toàn trang`);link.href=`pages/page-${String(s.page_number).padStart(3,'0')}.png`;link.target='_blank';body.append(link);if(s.asset_path){const img=el('img');img.src=s.asset_path;img.alt=`Ảnh nguồn trang ${s.page_number}`;img.loading='lazy';body.append(img)}}}
function draw(){const nav=document.querySelector('#list');nav.replaceChildren();const q=document.querySelector('#search').value.toLocaleLowerCase('vi');items.forEach((item,i)=>{if(!(`${item.source_number} ${item.stem.text_raw}`.toLocaleLowerCase('vi').includes(q)))return;const b=el('button',`item${selected===i?' active':''}`,`Câu ${item.source_number}`);b.append(el('small','',`Trang ${[...new Set(item.source_regions.map(s=>s.page_number))].join(', ')} · Cần duyệt`));b.onclick=()=>{selected=i;draw()};nav.append(b)});const main=document.querySelector('#main');main.replaceChildren();if(!items.length){main.append(el('div','empty','Chưa tách được câu. Kiểm tra OCR / profile bố cục.'));return}const item=items[selected];const heading=el('div','heading');const title=el('div');title.append(el('h2','',`Câu ${item.source_number}`),el('div','muted',item.question_id));heading.append(title,el('span','badge','Công thức và bước giải chưa được kiểm chứng'));main.append(heading);const cols=el('div','columns'),left=el('div'),right=el('div');cols.append(left,right);main.append(cols);for(const [key,label] of [['stem','Đề bài · ảnh nguồn'],['answer','Đáp án trong nguồn'],['solution','Lời giải · ảnh nguồn']]){const[c,b]=card(label);sources(b,item[key]);if(!item[key].source_spans.length)b.append(el('p','muted','Chưa có nguồn phù hợp; cần kiểm tra.'));left.append(c)}const[status,sb]=card('Trạng thái và cảnh báo');sb.append(el('p','muted','Ảnh nguồn giữ bố cục toán. Chữ native có thể mất phân số, số mũ và ký hiệu.'));item.review_flags.forEach(f=>sb.append(el('span','flag',f)));right.append(status);const[native,nb]=card('Chữ trích xuất · dùng đối chiếu');nb.append(el('pre','',item.stem.text_raw));const d=el('details');d.append(el('summary','','Xem chữ lời giải'),el('pre','',item.solution.text_raw));nb.append(d);right.append(native);const[steps,st]=card(`Bước giải ứng viên (${item.reference_steps.length})`);st.append(el('p','muted','Nhóm đoạn theo tín hiệu trong nguồn; chưa phải rubric hay các bước đã duyệt.'));item.reference_steps.forEach(s=>{const row=el('div','step');row.append(el('strong','',s.kind_candidate),el('pre','',s.text_raw),el('p','muted',`Trang ${[...new Set(s.source_spans.map(x=>x.page_number))].join(', ')} · ${s.status}`));st.append(row)});right.append(steps);main.scrollTop=0}
document.querySelector('#search').addEventListener('input',()=>draw());
const originalDraw=draw;draw=function(){originalDraw();const item=items[selected];if(!item?.ocr_evidence?.length)return;const[c,b]=card('OCR · công thức ứng viên');b.append(el('p','muted','Kết quả model chưa duyệt. Đối chiếu với ảnh nguồn trước khi sử dụng.'));for(const block of item.ocr_evidence){b.append(el('p','muted',`Trang ${block.page_number} · ${block.parser_id} · ${block.block_type}`),el('pre','',block.text_raw))}document.querySelector('.columns>div:last-child').prepend(c)};draw();
</script></html>
