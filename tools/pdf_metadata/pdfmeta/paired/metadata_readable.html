<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metadata câu hỏi · Coach Learning</title>
<style>
:root{--ink:#183c39;--muted:#6d807c;--green:#13775c;--line:#dce7e0;--paper:#fff;--wash:#f3f6f3;--amber:#95651d}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.65 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}a{color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9ad5bb;outline-offset:3px}
.top{background:var(--paper);border-bottom:1px solid var(--line)}.top-inner{max-width:1600px;margin:auto;padding:27px 32px 22px}.brand{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--green)}.title-row{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:29px;letter-spacing:-.6px;margin:5px 0}h2{font-size:25px;letter-spacing:-.5px;margin:5px 0 8px}h3{font-size:14px;margin:0}.subtitle{color:var(--muted);margin:2px 0 15px}.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.button{display:inline-flex;justify-content:center;align-items:center;gap:7px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:white;color:var(--ink);font-size:12px;text-decoration:none;white-space:nowrap}.button.primary{background:var(--green);border-color:var(--green);color:white}.stats{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:12px}.stats b{color:var(--ink);font-size:17px;margin-right:5px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);max-width:1600px;margin:22px auto;gap:22px;padding:0 24px}.sidebar{align-self:start;position:sticky;top:18px;border:1px solid var(--line);border-radius:13px;background:white;padding:18px;min-width:0}.section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}.filters{display:grid;gap:9px;margin:13px 0}input,select{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;background:#fafcfb;color:var(--ink);padding:10px;font-size:12px}.list-summary{display:flex;justify-content:space-between;align-items:center;margin:15px 0 8px;font-size:11px;color:var(--muted)}.list{max-height:51vh;overflow:auto;display:grid;gap:7px}.item{width:100%;min-width:0;display:block;text-align:left;border:1px solid transparent;border-radius:8px;padding:11px;background:transparent;color:var(--ink)}.item:hover{background:#f5f8f6}.item[aria-current=true]{background:#e9f4ee;border-color:#a9cdb9}.item-title{display:flex;align-items:center;gap:8px}.number{font:10px/1.4 Consolas,monospace;color:#658174;background:#edf3ef;border-radius:4px;padding:3px 5px;flex-shrink:0}.item strong{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.item .excerpt{display:block;font-size:11px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:4px}.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px;color:var(--muted);font-size:11px}.pager button{padding:6px 11px}.main{min-width:0}.record{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.record-head{padding:24px 26px 0}.record-top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.eyebrow{font-size:11px;color:var(--green);font-weight:600}.status{font-size:11px;background:#fff6e5;color:var(--amber);padding:4px 9px;border-radius:20px;white-space:nowrap}.record-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 19px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:0 26px}.tab{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:12px 1px;font-size:13px}.tab[aria-selected=true]{color:var(--green);font-weight:700;border-bottom-color:var(--green)}.panels{padding:23px 26px 26px}.panel[hidden]{display:none}.overview{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px}.content-sections{display:grid;gap:17px;align-content:start}.text-card{border:1px solid var(--line);border-radius:10px;padding:19px 20px}.card-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}.step{font-size:10px;font-weight:700;background:#edf5ef;color:var(--green);width:25px;height:25px;display:grid;place-items:center;border-radius:7px}.extracted{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9;margin:0}.empty{font-size:12px;color:var(--muted)}.meta-column{display:grid;gap:15px;align-content:start;min-width:0}.meta-card{background:#f8faf8;border:1px solid #e5ece6;border-radius:10px;padding:17px}.field{margin-top:13px}.field dt{font-size:11px;color:var(--muted)}.field dd{margin:3px 0 0;overflow-wrap:anywhere;font-size:12px}.value{font-weight:600}.hint{font-size:11px;color:var(--muted);margin:15px 0 0;line-height:1.8}.notes{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}summary{cursor:pointer;font-size:12px}ul{padding-left:18px}.notes li{font-size:11px;color:var(--muted);margin:6px 0}.technical{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}.technical dl{display:grid;gap:12px}.technical code{font-size:11px;overflow-wrap:anywhere}.source-figure{margin:0 0 20px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.source-figure figcaption{background:#f7faf7;color:var(--muted);padding:9px 13px;font-size:12px}.source-figure img{display:block;width:100%;height:auto;background:white}.image-hint{font-size:12px;color:var(--muted);margin:0 0 18px}.json-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:12px}.json{margin:0;background:#122722;color:#d9e7df;border-radius:9px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:75vh;overflow:auto;font:12px/1.8 Consolas,monospace}.json .key{color:#8fcddb}.json .string{color:#bde0ad}.json .number-token{color:#efc485}.json .literal{color:#d1b6e8}.record-nav{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 24px;color:var(--muted);font-size:11px}.feedback{min-height:20px;color:var(--green);font-size:11px;display:inline-block}.loading{padding:40px;color:var(--muted)}
@media(max-width:1150px){.overview{grid-template-columns:minmax(0,1fr)}.meta-column{grid-template-columns:repeat(2,minmax(0,1fr))}.top-actions{gap:6px}.layout{grid-template-columns:270px minmax(0,1fr);gap:16px;padding:0 18px}}
@media(max-width:760px){.top-inner{padding:20px 17px}.title-row{display:block}h1{font-size:25px}.top-actions{margin:12px 0}.stats{gap:17px}.layout{grid-template-columns:minmax(0,1fr);padding:0 12px;margin-top:14px;gap:14px}.sidebar{position:static;padding:15px}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters input{grid-column:1/-1}.list{max-height:195px}.record-head{padding:19px 17px 0}.record-top{display:block}.status{display:inline-block;margin-bottom:9px}.tabs{margin:0 17px;gap:20px}.panels{padding:18px 17px}.meta-column{grid-template-columns:minmax(0,1fr)}h2{font-size:23px}.text-card{padding:16px}.record-nav{padding:12px}.record-actions .button{font-size:11px;padding:7px 10px}.json{padding:14px;font-size:11px}.json-tools{align-items:flex-start}.feedback{max-width:190px}.record-nav>span{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="brand">COACH LEARNING · KHO DỮ LIỆU TOÁN</div><div class="title-row"><h1>Metadata câu hỏi</h1><div class="top-actions"><a class="button" href="index.html">Xem bộ câu hỏi</a><a id="pretty-download" class="button primary" download>Tải JSON đã định dạng ↓</a></div></div><p class="subtitle">Đề bài, lời giải và nguồn được trình bày riêng cho từng câu.</p><div class="stats" id="stats"></div></div></header>
<div class="layout"><aside class="sidebar"><div class="section-label">Danh sách câu hỏi</div><div class="filters"><input id="search" aria-label="Tìm câu hỏi" placeholder="Tìm số mục hoặc đầu đề…"><select id="chapter" aria-label="Chọn chương"></select><select id="document" aria-label="Chọn tài liệu"></select></div><div class="list-summary"><span id="count"></span><span>Chọn một câu để xem</span></div><nav id="list" class="list" aria-label="Các câu hỏi"></nav><div class="pager"><button id="page-prev" class="button" aria-label="Trang danh sách trước">←</button><span id="page-count"></span><button id="page-next" class="button" aria-label="Trang danh sách sau">→</button></div></aside><main id="main" class="main" aria-live="polite"><div class="record loading">Đang mở metadata…</div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),size=40,fmt=n=>new Intl.NumberFormat('vi-VN').format(n);
let catalog,filtered=[],page=0,selected=null,record=null,activeTab='overview',request=null,downloadUrl=null;
const noteLabels={MATH_LAYOUT_NOT_VERIFIED:'Bố cục biểu thức chưa được kiểm tra.',MISSING_ANSWER:'Nguồn không có nhãn đáp án ghi riêng.',PDFIUM_NATIVE_TEXT_NOT_MATH_TRANSCRIPTION:'Text đọc từ PDF chưa phải công thức LaTeX chuẩn.',REFERENCE_STEPS_NOT_VERIFIED:'Chưa kiểm tra cách tách các bước giải.',SOURCE_MATH_NOT_VERIFIED:'Chưa xác minh tính đúng của nội dung toán.',FOLLOWING_SECTION_CONTEXT_DETACHED:'Đã tách phần mở đầu bài tiếp theo khỏi lời giải.'};
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function button(text,handler,cls='button'){const b=node('button',text,cls);b.type='button';b.onclick=handler;return b;}
function normalize(s){return s.toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function field(label,value,cls){const dl=node('dl',undefined,'field');dl.append(node('dt',label),node('dd',value,cls));return dl;}
function pages(values){return values.length?values.join(', '):'Chưa có thông tin';}
function chosenIndex(){return filtered.findIndex(q=>q.id===selected);}
function renderList(){const list=$('list');list.replaceChildren();for(const s of filtered.slice(page*size,(page+1)*size)){const b=button('',()=>openRecord(s),'item');b.setAttribute('aria-current',String(s.id===selected));b.dataset.id=s.id;const title=node('span',undefined,'item-title');title.append(node('span',String(s.number).padStart(4,'0'),'number'),node('strong',s.label));b.append(title,node('span',s.damaged_text_roles?.length?'Công thức cần đọc từ ảnh nguồn':s.preview.replace(/\n/g,' '),'excerpt'));list.append(b);}$('count').textContent=fmt(filtered.length)+' mục';$('page-count').textContent='Trang '+(page+1)+' / '+Math.max(1,Math.ceil(filtered.length/size));$('page-prev').disabled=page===0;$('page-next').disabled=(page+1)*size>=filtered.length;}
function applyFilter(){const ch=$('chapter').value,doc=$('document').value,text=normalize($('search').value.trim());filtered=catalog.questions.filter(q=>(!ch||q.chapter_id===ch)&&(!doc||q.document_id===doc)&&(!text||normalize(q.number+' '+q.label+' '+q.preview+' '+q.source_name).includes(text)));page=0;renderList();if(!filtered.length){if(request)request.abort();selected=null;record=null;$('main').replaceChildren(node('div','Không tìm thấy câu phù hợp. Thử xóa từ khóa hoặc đổi bộ lọc.','record loading'));}else if(!filtered.some(q=>q.id===selected)){openRecord(filtered[0]);}}
async function openRecord(s){if(request)request.abort();request=new AbortController();selected=s.id;record=null;renderList();$('main').replaceChildren(node('div','Đang mở mục '+s.number+'…','record loading'));try{const r=await fetch(s.record,{signal:request.signal});if(!r.ok)throw Error('Không tải được metadata của câu này.');const q=await r.json();if(selected!==s.id)return;if(q.question_id!==s.id)throw Error('Mã câu không khớp với danh sách.');record=q;renderRecord(s);}catch(e){if(e.name!=='AbortError'&&selected===s.id)$('main').replaceChildren(node('div',String(e),'record loading'));}}
function hasDamagedText(text){return /[\uE000-\uF8FF\uFFFD\u{F0000}-\u{FFFFD}\u{100000}-\u{10FFFD}]/u.test(text||'');}
function textCard(number,title,text){const card=node('section',undefined,'text-card');const h=node('div',undefined,'card-head');h.append(node('span',number,'step'),node('h3',title));card.append(h);if(hasDamagedText(text)){card.append(node('p','Bản text bị mất ký hiệu toán. Đọc công thức tại ảnh nguồn phía trên.','empty'));const raw=node('details',undefined,'notes');raw.append(node('summary','Xem text thô bị lỗi ký hiệu'),node('p',text,'extracted'));card.append(raw);}else{card.append(node('p',text||'Không có nội dung được ghi riêng.','extracted'));}return card;}
function renderRecord(s){const q=record,box=node('article',undefined,'record');box.dataset.question=q.question_id;const head=node('div',undefined,'record-head'),top=node('div',undefined,'record-top'),title=node('div');title.append(node('div',q.chapter_title||'Chưa phân nhóm','eyebrow'),node('h2','Mục '+String(s.number).padStart(4,'0')+' · '+s.label));top.append(title,node('span',q.academic_review==='PENDING'?'Chưa duyệt nội dung toán':q.academic_review||'Chưa ghi trạng thái','status'));head.append(top);const actions=node('div',undefined,'record-actions'),feedback=node('span','','feedback');feedback.setAttribute('role','status');actions.append(button('Sao chép JSON',async()=>{try{await navigator.clipboard.writeText(JSON.stringify(q,null,2));feedback.textContent='Đã sao chép metadata của câu này.';}catch{feedback.textContent='Bạn có thể dùng nút Tải câu này.';}}),button('Tải câu này ↓',()=>{if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(new Blob([JSON.stringify(q,null,2)+'\n'],{type:'application/json;charset=utf-8'}));const a=node('a');a.href=downloadUrl;a.download='metadata-muc-'+String(s.number).padStart(4,'0')+'.json';a.click();}),feedback);head.append(actions);box.append(head);
const tabs=node('div',undefined,'tabs');tabs.setAttribute('role','tablist');const panels=node('div',undefined,'panels');for(const [id,label] of [['overview','Thông tin'],['images','Ảnh nguồn'],['json','JSON']]){const t=button(label,()=>{activeTab=id;renderRecord(s);},'tab');t.id='tab-'+id;t.setAttribute('role','tab');t.setAttribute('aria-selected',String(activeTab===id));t.setAttribute('aria-controls','panel-'+id);tabs.append(t);const panel=node('section',undefined,'panel');panel.id='panel-'+id;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby',t.id);panel.hidden=activeTab!==id;if(!panel.hidden){if(id==='overview')renderOverview(panel,q,s);if(id==='images')renderImages(panel,q);if(id==='json'){const toolbar=node('div',undefined,'json-tools');toolbar.append(node('span','Đầy đủ trường dữ liệu · thụt lề 2 khoảng trắng'),node('span','UTF-8'));panel.append(toolbar,highlight(q));}}panels.append(panel);}box.append(tabs,panels);
const nav=node('div',undefined,'record-nav'),index=chosenIndex(),prev=button('← Mục trước',()=>move(-1)),next=button('Mục tiếp →',()=>move(1));prev.disabled=index<=0;next.disabled=index<0||index>=filtered.length-1;nav.append(prev,node('span','Mục '+(index+1)+' trong '+fmt(filtered.length)+' kết quả'),next);$('main').replaceChildren(box,nav);}
function move(delta){const s=filtered[chosenIndex()+delta];if(s){page=Math.floor((chosenIndex()+delta)/size);openRecord(s);}}
function renderOverview(panel,q,s){const grid=node('div',undefined,'overview'),content=node('div',undefined,'content-sections');if([q.question?.text_lossy,q.solution?.text_lossy,q.answer?.text_raw].some(hasDamagedText)){const source=node('section',undefined,'text-card');source.append(node('h3','Đọc từ ảnh gốc · Text đang mất ký hiệu toán'));renderImages(source,q);content.append(source);}content.append(textCard('01','Đề bài',q.question?.text_lossy),textCard('02','Lời giải',q.solution?.text_lossy));if(q.answer?.text_raw)content.append(textCard('03','Đáp án ghi riêng',q.answer.text_raw));const note=node('p','Văn bản trích xuất dùng để tra cứu. Đối chiếu công thức, bảng và hình vẽ tại tab Ảnh nguồn.','hint');content.append(note);const meta=node('div',undefined,'meta-column'),source=node('section',undefined,'meta-card');source.append(node('h3','Nguồn tài liệu'),field('Tệp gốc',q.source?.name||'Chưa ghi nguồn'),field('Trang trong tài liệu gốc',pages(s.source_pages),'value'),field('Trang trong PDF tổng hợp',pages(q.collection_pdf_pages||[]),'value'));const state=node('section',undefined,'meta-card');state.append(node('h3','Trạng thái dữ liệu'),field('Ghép đề và lời giải',q.pair_status==='PAIRED_LAYOUT_CANDIDATE'?'Đã ghép theo bố cục nguồn':q.pair_status||'Chưa ghi trạng thái'),field('Kiểm tra nội dung toán',q.academic_review==='PENDING'?'Chưa duyệt':q.academic_review||'Chưa ghi trạng thái'),field('Hỗ trợ chấm tự động',q.grading_support==='NOT_ASSESSED'?'Chưa đánh giá':q.grading_support||'Chưa ghi trạng thái'),field('Nhãn đáp án riêng',q.answer?.text_raw?'Có trong nguồn':'Không ghi riêng trong nguồn'));const notes=node('details',undefined,'notes');notes.append(node('summary',(q.quality_flags||[]).length+' ghi chú trích xuất'));const ul=node('ul');for(const f of q.quality_flags||[])ul.append(node('li',noteLabels[f]||f));notes.append(ul);state.append(notes);meta.append(source,state);grid.append(content,meta);panel.append(grid);const technical=node('details',undefined,'technical');technical.append(node('summary','Chi tiết kỹ thuật: mã câu và hash nguồn'));for(const [key,value] of [['Mã câu',q.question_id],['SHA-256 của PDF gốc',q.source?.sha256||''],['Hệ tọa độ nguồn','PDF point · gốc trên bên trái']]){const f=field(key,'');f.lastChild.append(node('code',value));technical.append(f);}panel.append(technical);}
function renderImages(panel,q){panel.append(node('p','Ảnh trích từ tài liệu gốc để đối chiếu đề, lời giải và các ký hiệu toán.','image-hint'));const base=new URL('assets/',location.href);for(const s of q.collection_source_spans||[]){const url=new URL(s.asset_path,location.href);if(url.origin!==base.origin||!url.pathname.startsWith(base.pathname))continue;const figure=node('figure',undefined,'source-figure'),im=node('img');im.loading='lazy';im.src=url.href;im.alt='Đề và lời giải, trang nguồn '+s.page_number;const caption=node('figcaption','Trang nguồn '+s.page_number+(s.column?' · cột '+s.column:'')),link=node('a','Mở ảnh đầy đủ ↗');link.href=url.href;link.target='_blank';link.rel='noopener';link.style.marginLeft='12px';caption.append(link);figure.append(caption,im);panel.append(figure);}}
function highlight(q){const pre=node('pre',undefined,'json'),text=JSON.stringify(q,null,2),regex=/"(?:\\.|[^"\\])*"\s*:|"(?:\\.|[^"\\])*"|\b(?:true|false|null)\b|-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b/g;let last=0;for(const m of text.matchAll(regex)){pre.append(document.createTextNode(text.slice(last,m.index)));const cls=m[0].startsWith('"')?(m[0].trimEnd().endsWith(':')?'key':'string'):/^(true|false|null)$/.test(m[0])?'literal':'number-token';pre.append(node('span',m[0],cls));last=m.index+m[0].length;}pre.append(document.createTextNode(text.slice(last)));return pre;}
fetch('metadata-catalog.json').then(r=>{if(!r.ok)throw Error('Không mở được danh sách metadata.');return r.json();}).then(data=>{catalog=data;for(const [value,label] of [[data.count,'mục có lời giải'],[data.chapters.length,'nhóm kiến thức'],[data.documents.length,'tài liệu nguồn']]){const n=node('span');n.append(node('b',fmt(value)),document.createTextNode(label));$('stats').append(n);}$('pretty-download').href=data.pretty_file;$('chapter').append(new Option('Tất cả các chương',''));for(const c of data.chapters)$('chapter').append(new Option(c.title+' · '+fmt(c.count),c.id));$('document').append(new Option('Tất cả tài liệu',''));for(const d of data.documents)$('document').append(new Option(d.name+' · '+d.count,d.id));$('chapter').onchange=applyFilter;$('document').onchange=applyFilter;$('search').oninput=applyFilter;$('page-prev').onclick=()=>{page--;renderList();};$('page-next').onclick=()=>{page++;renderList();};applyFilter();}).catch(e=>$('main').replaceChildren(node('div',String(e),'record loading')));
</script>
</body></html>
