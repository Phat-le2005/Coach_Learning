<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bản nháp nội dung toán · Coach Learning</title><link rel="stylesheet" href="vendor/katex.min.css"><script defer src="vendor/katex.min.js"></script>
<style>
:root{--ink:#183d36;--muted:#697e76;--green:#14795d;--line:#dbe7df;--wash:#f3f7f4}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.65 "Segoe UI",system-ui,sans-serif}button,select,input{font:inherit}button,a{touch-action:manipulation}a{color:var(--green)}button{cursor:pointer}.top{background:white;border-bottom:1px solid var(--line)}.wrap{max-width:1760px;margin:auto;padding:24px 30px}.brand{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--green)}h1{font-size:28px;letter-spacing:-.6px;margin:6px 0}h2{font-size:24px;letter-spacing:-.5px;margin:4px 0}h3{font-size:14px;margin:0}.title{display:flex;justify-content:space-between;align-items:center;gap:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 13px;text-decoration:none;font-size:12px}.button.primary{background:var(--green);color:white;border-color:var(--green)}.muted{font-size:12px;color:var(--muted)}.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:12px}.stats b{font-size:19px;color:var(--ink);margin-right:5px}.progress{height:5px;background:#e8efea;border-radius:5px;overflow:hidden;margin-top:17px}.progress span{display:block;height:100%;background:var(--green);transition:width .3s}.layout{max-width:1760px;margin:22px auto;padding:0 24px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.sidebar{position:sticky;top:18px;align-self:start;background:white;border:1px solid var(--line);border-radius:12px;padding:17px;min-width:0}.filters{display:grid;gap:9px;margin:14px 0}input,select{min-width:0;width:100%;border:1px solid var(--line);background:#f9fbf9;padding:9px;border-radius:7px;font-size:12px;color:var(--ink)}.list{display:grid;gap:7px;max-height:63vh;overflow:auto}.item{padding:11px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;color:var(--ink);font-size:12px}.item[aria-current=true]{background:#eaf5ee;border-color:#b2d1be}.item small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.main{min-width:0}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{padding:22px 24px 16px;border-bottom:1px solid var(--line)}.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.badge{display:inline-block;font-size:10px;border-radius:20px;background:#fff4dc;color:#8b641d;padding:4px 9px}.notice{background:#eef6f0;border:1px solid #d5e6d9;border-radius:8px;padding:12px 15px;font-size:12px;margin-top:14px}.tabs{display:flex;gap:22px;margin-top:16px}.tab{padding:8px 0;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:12px}.tab[aria-selected=true]{border-color:var(--green);color:var(--green);font-weight:700}.panels{padding:20px 24px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}.column{min-width:0}.section{margin-bottom:20px}.section-title{font-size:11px;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin:0 0 12px}.source{margin:0 0 14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.source figcaption{padding:8px 12px;background:#f8faf8;font-size:11px;color:var(--muted)}.source img{display:block;width:100%;height:auto;background:white}.source a{margin-left:10px}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9}.text .katex{font-size:1.08em}.block-image{max-width:100%;max-height:240px;width:auto;height:auto;object-fit:contain;display:block;margin:12px 0;border:1px solid var(--line);border-radius:6px}.math-inline{display:inline;overflow-wrap:normal}.choice{display:flex;gap:10px;border:1px solid var(--line);border-radius:7px;padding:11px;margin:8px 0;min-width:0}.choice>b{color:var(--green)}.choice .text{min-width:0;overflow:auto}.issues{margin:15px 0;padding:14px;border:1px solid #eedbb7;background:#fffaf0;border-radius:8px;color:#89621e;font-size:11px}.issues ul{margin:6px 0;padding-left:20px}.formula{border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:13px}.formula-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:10px}.formula img{max-width:100%;max-height:160px;object-fit:contain}.formula .math{overflow:auto;padding:8px}.formula code,.json{font:12px/1.8 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.formula details{margin-top:10px;color:var(--muted);font-size:11px}.formula summary{cursor:pointer}.json{background:#142c24;color:#d9e9df;border-radius:8px;padding:18px;max-height:80vh;overflow:auto}.loading{padding:35px;color:var(--muted)}.empty{font-size:12px;color:var(--muted);padding:12px 0}.review-note{margin-top:15px;font-size:12px;padding:13px;border:1px solid var(--line);border-radius:8px;background:#f8faf8}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9ad5bb;outline-offset:3px}
@media(max-width:1200px){.layout{grid-template-columns:240px minmax(0,1fr);gap:15px;padding:0 15px}.columns{grid-template-columns:minmax(0,1fr)}.panels{padding:18px}.head{padding:18px}.column+.column{border-top:1px solid var(--line);padding-top:20px}}
@media(max-width:760px){.wrap{padding:20px 16px}.title{display:block}h1{font-size:24px}.actions{margin-top:12px}.layout{grid-template-columns:minmax(0,1fr);padding:0 11px;margin-top:13px}.sidebar{position:static;padding:14px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.list{max-height:190px}.stats{gap:13px}.head-row{display:block}.tabs{gap:18px}.formula-grid{grid-template-columns:minmax(0,1fr)}h2{font-size:21px}.text{font-size:13px}.panels{padding:15px}.head{padding:16px}}
.table-wrap{overflow:auto;margin:16px 0;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;min-width:100%;font-size:12px}th,td{padding:9px 12px;border:1px solid var(--line);white-space:nowrap}td .block-image,th .block-image{max-height:65px;min-width:70px;border:0;margin:0}th{background:#edf6f0;text-align:left}td .text,th .text{font-size:12px;white-space:pre;overflow-wrap:normal;line-height:1.6}td:first-child,th:first-child{min-width:170px}</style></head><body>
<header class="top"><div class="wrap"><div class="brand">COACH LEARNING · CHUẨN HÓA NỘI DUNG</div><div class="title"><div><h1>Nội dung toán · Thử nghiệm v2</h1><div class="muted" id="status">Đang tải tiến trình…</div></div><div class="actions"><a class="button" href="../corpus/metadata.html">Kho nguồn</a><a class="button" href="comparison-v1-v2.json" download>So sánh v1/v2</a><a class="button" href="content.draft.jsonl" download>JSONL</a><a class="button primary" href="content.draft.pretty.json" download>JSON nội dung ↓</a></div></div><div class="stats" id="stats"></div><div class="muted" id="visionStatus" aria-live="polite"></div><div class="progress"><span id="bar"></span></div></div></header>
<div class="layout"><aside class="sidebar"><h3>Danh sách câu hỏi</h3><div class="filters"><input id="search" placeholder="Tìm số câu hoặc tên tài liệu" aria-label="Tìm câu"><select id="chapter" aria-label="Chương"><option value="">Tất cả chương</option><option value="derivative_applications">Ứng dụng đạo hàm</option><option value="integrals">Nguyên hàm, tích phân</option><option value="grouped_statistics">Thống kê</option><option value="probability">Xác suất</option></select><select id="scope" aria-label="Phạm vi"><option value="">Toàn bộ mẫu</option><option value="evaluation">Bộ đánh giá 40 câu</option><option value="issues">Có cảnh báo kỹ thuật</option></select></div><div class="list" id="list"></div></aside><main class="main" id="main"><div class="card loading">Chờ câu đầu tiên được xử lý…</div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;},btn=(text,handler,cls='button')=>{const n=el('button',text,cls);n.type='button';n.onclick=handler;return n;};
let catalog=null,selected=null,record=null,tab='content',request=null;
const roles={question:'Đề bài',solution:'Lời giải',answer:'Đáp án ghi riêng'},issueNames={UNCOVERED_SUSPECT_MATH_GLYPHS:'Còn ký hiệu nghi là toán chưa được đưa vào vùng công thức',UNMAPPED_SOURCE_ROWS:'Có dòng dùng font chưa ánh xạ được',LATEX_SYNTAX_FAILURE:'Có công thức chưa qua kiểm tra cú pháp',NATIVE_OCR_CONFLICT:'Cách đọc native và OCR khác nhau',TABLE_OR_SIGN_CHART_REQUIRES_SOURCE_IMAGE:'Bảng hoặc bảng dấu được giữ bằng ảnh nguồn',VECTOR_FIGURE_REQUIRES_SOURCE_IMAGE:'Hình vẽ vector được giữ bằng ảnh nguồn',EMBEDDED_IMAGE_REQUIRES_SOURCE_IMAGE:'Có hình ảnh trong vùng nguồn',NO_READABLE_SOURCE_GLYPHS:'Vùng nguồn cần luồng OCR ảnh',TRANSCRIPTION_FAILED:'Lần xử lý câu bị lỗi, giữ ảnh nguồn',NATIVE_TABLE_GRID_EXTRACTED_DRAFT:'Đã tách bảng thành hàng và ô, cần đối chiếu nội dung',TABLE_CELLS_REQUIRE_IMAGE:'Ô bảng chưa đọc chắc được hiển thị bằng ảnh nguồn',SOURCE_LINE_ALIGNMENT_IMAGE_RETAINED:'Dòng ký tự ghép bị lặp trong PDF, giữ ảnh để đối chiếu',UNMAPPED_SOURCE_GLYPHS_IMAGE_RETAINED:'Còn ký hiệu font chưa ánh xạ được, giữ ảnh nguồn',FORMULA_CANDIDATES_HELD_FOR_SOURCE_REVIEW:'Các cách đọc công thức chưa khớp; đang dùng ảnh nguồn'};
function safeAsset(path){const u=new URL(path,location.href),b=new URL('assets/',location.href);return u.origin===b.origin&&u.pathname.startsWith(b.pathname)?u.href:null;}
function richInline(text){const box=el('div',undefined,'text'),regex=/!\[([^\]]*)\]\(([^)]+)\)|\$([^$\n]+)\$/g;let last=0;for(const m of (text||'').matchAll(regex)){box.append(document.createTextNode(text.slice(last,m.index)));if(m[2]){const url=safeAsset(m[2]);if(url){const a=el('a');a.href=url;a.target='_blank';a.rel='noopener';if(m[2].endsWith('-source.png')){a.textContent='Đối chiếu vùng nguồn chưa chuẩn hóa ↗';a.className='muted';}else{const im=el('img',undefined,'block-image');im.src=url;im.alt=m[1];im.loading='lazy';a.append(im);}box.append(a);}}else{const math=el('span',undefined,'math-inline');try{katex.render(m[3],math,{throwOnError:true,trust:false,strict:'error',maxExpand:100,maxSize:20});}catch(e){math.textContent='[Công thức cần đối chiếu ảnh]';math.dataset.syntax='fail';}box.append(math);}last=m.index+m[0].length;}box.append(document.createTextNode((text||'').slice(last)));return box;}
function rich(text){
 const out=el('div');const lines=(text||'').split('\n');let pending=[];
 function flush(){if(pending.length){out.append(richInline(pending.join('\n')));pending=[];}}
 for(let i=0;i<lines.length;i++){
  if(lines[i].trim().startsWith('|')&&lines[i+1]?.includes('---')){
   flush();const wrap=el('div',undefined,'table-wrap'),table=el('table');let header=true;
   while(i<lines.length&&lines[i].trim().startsWith('|')){
    const line=lines[i++];if(/^\|[\s|:-]+\|$/.test(line.trim()))continue;
    const row=el('tr');for(const val of line.trim().slice(1,-1).split(/(?<!\\)\|/)){const cell=el(header?'th':'td');cell.append(richInline(val.trim().replaceAll('<br>','\n').replaceAll('\\|','|')));row.append(cell);}table.append(row);header=false;
   }i--;wrap.append(table);out.append(wrap);
  }else pending.push(lines[i]);
 }flush();return out;
}
function displayLabel(text){const m=/(?:Câu|Bài|Ví dụ|Example)\s*\d/i.exec(text);return m?text.slice(m.index):text;}
function filtered(){const ch=$('chapter').value,scope=$('scope').value,search=$('search').value.toLowerCase().trim();return catalog.questions.filter(q=>(!ch||q.chapter_id===ch)&&(!scope||(scope==='evaluation'?q.evaluation:q.issues>0))&&(!search||(q.number+' '+q.label+' '+q.source_name).toLowerCase().includes(search)));}
function list(){const rows=filtered();$('list').replaceChildren();for(const q of rows){const n=btn('',()=>open(q),'item');n.setAttribute('aria-current',String(selected===q.question_id));n.append(el('strong','Mục '+q.number+' · '+displayLabel(q.label)),el('small',q.formulas+' công thức · '+(q.issues?q.issues+' cảnh báo':'Bản nháp text + LaTeX')+(q.evaluation?' · Đánh giá':'')));$('list').append(n);}if(!rows.length)$('list').append(el('div','Chưa có câu phù hợp.','empty'));return rows;}
async function open(q){if(request)request.abort();request=new AbortController();selected=q.question_id;list();try{const response=await fetch(q.record,{signal:request.signal});if(!response.ok)throw Error('Không tải được câu.');const value=await response.json();if(selected!==q.question_id)return;record=value;render(q);}catch(e){if(e.name!=='AbortError')$('main').replaceChildren(el('div',String(e),'card loading'));}}
function sourceFigure(fragment,role){const fig=el('figure',undefined,'source'),cap=el('figcaption',role+' · Trang '+fragment.page_number),url=safeAsset(fragment.source_asset);if(!url)return fig;const a=el('a','Mở ảnh ↗');a.href=url;a.target='_blank';a.rel='noopener';cap.append(a);const im=el('img');im.src=url;im.alt=role+' trong PDF gốc';im.loading='lazy';fig.append(cap,im);return fig;}
function content(panel){const columns=el('div',undefined,'columns'),source=el('section',undefined,'column'),draft=el('section',undefined,'column');source.append(el('div','Ảnh nguồn · Công thức và hình gốc','section-title'));draft.append(el('div','Văn bản và LaTeX · Cần kiểm tra nội dung','section-title'));for(const [role,label] of Object.entries(roles)){const p=record.parts[role];if(!p||(!p.markdown&&!p.fragments.length))continue;for(const fragment of p.fragments)source.append(sourceFigure(fragment,label));const section=el('section',undefined,'section');section.append(el('h3',label),rich(p.markdown));for(const choice of p.choices){const item=el('div',undefined,'choice');item.append(el('b',choice.label+'.'),rich(choice.markdown));section.append(item);}draft.append(section);}columns.append(source,draft);panel.append(columns);}
function formulaPanel(panel){for(const f of record.formula_candidates){const box=el('section',undefined,'formula');box.append(el('strong',roles[f.role]+' · Trang '+f.page_number+' · '+f.formula_id),el('div',(f.method==='LOCAL_FORMULA_IMAGE_READING'?'PP-FormulaNet local':'Đọc glyph và hình học native')+' · Cú pháp '+f.syntax.status+' · '+f.comparison,'muted'));const grid=el('div',undefined,'formula-grid'),im=el('img'),u=safeAsset(f.asset_path);if(u){im.src=u;im.alt='Vùng công thức gốc';im.loading='lazy';grid.append(im);}const math=el('div',undefined,'math');if(f.display_latex){try{katex.render(f.display_latex,math,{displayMode:true,throwOnError:true,trust:false,strict:'error',maxExpand:100,maxSize:20});math.dataset.syntax='pass';}catch(e){math.textContent=String(e);math.dataset.syntax='fail';}}else math.textContent='Giữ ảnh nguồn vì cú pháp chưa đạt.';grid.append(math);const details=el('details');details.append(el('summary','Mã LaTeX và dấu vết nguồn'),el('code',JSON.stringify({latex:f.latex_candidate,native:f.native_candidate,bbox:f.crop_bbox,syntax:f.syntax},null,2)));box.append(grid,details);panel.append(box);}if(!record.formula_candidates.length)panel.append(el('div','Không có vùng công thức được tách riêng. Xem ảnh và kiểm tra coverage của câu.','empty'));}
function render(q){const card=el('article',undefined,'card');card.dataset.question=record.question_id;const head=el('div',undefined,'head'),row=el('div',undefined,'head-row'),title=el('div');title.append(el('div',record.chapter_title,'muted'),el('h2','Mục '+q.number+' · '+displayLabel(q.label)),el('div',record.source.name,'muted'));const link=el('a','Tải câu này ↓','button');link.href=q.record;link.download='cau-'+q.number+'.json';row.append(title,link);head.append(row,el('div','Bản nháp có nguồn đối chiếu · Chưa đưa vào core chấm','notice'));const tabs=el('div',undefined,'tabs');for(const [id,label] of [['content','Đề và lời giải'],['formulas','Công thức ('+record.formula_candidates.length+')'],['json','JSON']]){const b=btn(label,()=>{tab=id;render(q);},'tab');b.setAttribute('aria-selected',String(tab===id));b.dataset.tab=id;tabs.append(b);}head.append(tabs);const panel=el('div',undefined,'panels');if(tab==='content')content(panel);if(tab==='formulas')formulaPanel(panel);if(tab==='json')panel.append(el('pre',JSON.stringify(record,null,2),'json'));if(record.issues.length){const issues=el('section',undefined,'issues');issues.append(el('strong','Các vùng cần đối chiếu nguồn'));const ul=el('ul');for(const issue of record.issues)ul.append(el('li',(roles[issue.role]||issue.role)+' · Trang '+issue.page_number+': '+(issueNames[issue.code]||issue.code)));issues.append(ul);panel.append(issues);}if(q.qwen_review){const info=el('div','Đang tải nhận xét Qwen local…','review-note');panel.append(info);fetch(q.qwen_review).then(r=>r.json()).then(v=>{info.textContent='Qwen local · '+v.result.verdict+' · '+v.result.issues.map(i=>i.note).join(' · ')+' (Đối chiếu một vùng ảnh của câu; không duyệt toàn bộ lời giải.)';}).catch(()=>info.textContent='Chưa mở được nhận xét Qwen.');}card.append(head,panel);$('main').replaceChildren(card);}
async function refresh(){try{const response=await fetch('catalog.json',{cache:'no-store'});if(!response.ok)return;catalog=await response.json();const r=catalog.report;$('status').textContent=(r.status==='RUNNING'?'Đang chạy':'Đã xuất bản nháp')+' · '+r.completed_questions+'/'+r.selected_questions+' câu · Giữ nguyên metadata nguồn';$('stats').replaceChildren();for(const [n,label] of [[r.completed_questions,'câu đã xử lý'],[r.formula_regions,'vùng công thức'],[r.evaluation_completed,'câu thuộc bộ đánh giá'],[r.source_documents,'PDF nguồn']]){const item=el('span');item.append(el('b',String(n)),document.createTextNode(label));$('stats').append(item);}$('bar').style.width=(100*r.completed_questions/r.selected_questions)+'%';if(r.scope==='PAGE_LAYOUT_AND_TRANSCRIPTION_SMOKE_NOT_SOLVED_PAIRING'){roles.question='Nội dung trang';const a=document.querySelector('a[href="content.draft.jsonl"]'),b=document.querySelector('a[href="content.draft.pretty.json"]'),c=document.querySelector('a[href="comparison-v1-v2.json"]');if(a){a.href='report.json';a.textContent='Báo cáo trang';}if(b){b.href='catalog.json';b.textContent='Danh sách trang';}if(c)c.remove();$('status').textContent='Đã đọc '+r.completed_pages+'/'+r.selected_questions+' trang · Chẩn đoán layout, không phải cặp đề và lời giải.';}const rows=list();if(!selected&&rows.length)open(rows[0]);fetch('vision-progress.json',{cache:'no-store'}).then(v=>v.ok?v.json():null).then(v=>{if(v)$('visionStatus').textContent='Qwen local đối chiếu ảnh: '+v.completed+'/'+v.selected+' vùng · Mỗi câu một vùng, chưa duyệt toàn bộ lời giải.';}).catch(()=>{});}catch(e){$('status').textContent=String(e);}}
window.addEventListener('load',()=>{for(const id of ['chapter','scope','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{const rows=list();if(!rows.length){selected=null;record=null;$('main').replaceChildren(el('div','Không có câu phù hợp với bộ lọc.','card loading'));}else if(!rows.some(q=>q.question_id===selected))open(rows[0]);});refresh();setInterval(refresh,4000);});
</script></body></html>
