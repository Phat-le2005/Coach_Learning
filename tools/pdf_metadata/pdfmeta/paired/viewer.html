<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coach · Đề và lời giải</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f5;color:#193c40;font:14px/1.6 "Segoe UI",system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}header{padding:24px 30px;background:#fff;border-bottom:1px solid #dce8e1}header small{color:#16816a;letter-spacing:1.5px;font-size:10px}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;margin:0}h3{font-size:14px;margin:0 0 12px}.intro,.muted{color:#6c8185}.intro{margin:0;overflow-wrap:anywhere}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.tag{display:inline-block;background:#e8f5ef;border:1px solid #d6e9df;color:#1c715d;border-radius:7px;padding:5px 9px;font-size:12px}.warn{color:#956321;background:#fff7e5;border-color:#edddbd}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;max-width:1420px;margin:22px auto;padding:0 22px}aside{align-self:start;position:sticky;top:18px;padding:16px;border:1px solid #d8e5de;border-radius:12px;background:#fff}input,select{width:100%;border:1px solid #cedfd6;border-radius:7px;padding:10px;background:#fff;margin:0 0 10px}.list{max-height:65vh;overflow:auto;display:grid;gap:7px}.item{text-align:left;padding:10px 12px;background:#fff;border:1px solid #e1ebe5;border-radius:8px}.item[aria-current=true]{background:#eaf6ef;border-color:#83bca8}.item b{display:block}.item small{display:block;color:#75858b;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:20px;color:#74898a}.main{min-width:0}.card{background:#fff;border:1px solid #d8e5de;border-radius:13px;padding:24px;margin-bottom:18px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.notice{padding:13px 16px;border:1px solid #eddfba;background:#fffaec;border-radius:8px;font-size:12px;margin:18px 0}.section{margin:24px 0 0}.section-label{font-size:10px;letter-spacing:1.6px;color:#248168;font-weight:700}.source-image{display:block;width:100%;height:auto;border:1px solid #e8ede9;border-radius:7px;background:#fff;margin:8px 0 16px}figcaption{font-size:11px;color:#7e8c91}figure{margin:12px 0}details{border-top:1px solid #e1ebe5;padding-top:12px;margin-top:18px}summary{cursor:pointer;font-weight:600;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,monospace;background:#f6f8f7;padding:14px;border-radius:7px;max-height:420px;overflow:auto}button.action{border:1px solid #c8ddd2;background:#fff;border-radius:7px;padding:9px 13px}.endnote{font-size:12px;color:#6c8185;margin-bottom:25px}.flags{overflow-wrap:anywhere}.source-name{font-size:12px;color:#6c8185}.answer-label{font-weight:600}.count{font-size:12px;color:#6c8185;margin:0 0 10px}@media(max-width:760px){header{padding:20px 16px}.layout{grid-template-columns:1fr;padding:0 12px;margin-top:14px;gap:14px}aside{position:static}.list{max-height:190px}.card{padding:16px}h1{font-size:23px}.topline{align-items:flex-start}.stats{gap:6px}pre{padding:10px}}
.layout>aside,.list,.item{min-width:0}.list{grid-template-columns:minmax(0,1fr)}.item{width:100%;max-width:100%}@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
</style>
<header><small>COACH LEARNING · TẬP DỮ LIỆU CÓ NGUỒN</small><h1>Đề ở trên. Lời giải ở dưới.</h1><p class="intro" id="source-name"></p><div class="stats" id="stats"></div></header>
<div class="layout"><aside><h3>Danh sách câu</h3><input id="search" aria-label="Tìm câu" placeholder="Số câu hoặc nội dung…"><select id="filter" aria-label="Lọc câu"><option value="">Tất cả lần xuất hiện</option><option value="PAIRED_LAYOUT_CANDIDATE" selected>Có đề và lời giải</option><option value="MISSING_SOLUTION">Chưa ghép được lời giải</option></select><p class="count" id="count"></p><nav class="list" id="list" aria-label="Chọn câu"></nav></aside><main class="main"><article class="card" id="question"></article><p class="endnote">Một file HTML chứa ảnh và dữ liệu, mở được offline. Text trích xuất có thể mất ký hiệu; ảnh nguồn là bản đối chiếu. Chưa dùng các record làm đáp án chấm chính thức.</p></main></div>
<script type="application/json" id="paired-dataset">__PAIRED_PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('paired-dataset').textContent), qs=data.questions;
let selected=(qs.find(q=>q.pair_status==='PAIRED_LAYOUT_CANDIDATE')||qs[0])?.question_id;
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function label(q){return 'Câu '+q.source_number;}
function pages(q){return [...new Set(['question','solution','answer'].flatMap(k=>q[k].source_spans.map(s=>s.page_number)))].sort((a,b)=>a-b).join(', ');}
function download(value,name){const u=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'})),a=node('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function figure(span){const f=node('figure'),im=node('img');im.className='source-image';im.alt='Ảnh nguồn trang PDF '+span.page_number;im.src=data.images[span.asset_path].data_url;f.append(node('figcaption','Trang PDF '+span.page_number),im);return f;}
function part(q,key,title){const s=node('section',undefined,'section');s.append(node('span',title,'section-label'));const spans=q[key].source_spans.filter(x=>x.asset_path);if(spans.length)for(const span of spans)s.append(figure(span));else s.append(node('p','Chưa có vùng nguồn được xác định.','muted'));return s;}
function choose(id){selected=id;const q=qs.find(q=>q.question_id===id),box=document.getElementById('question');box.replaceChildren();if(!q){box.append(node('p','Chưa có câu phù hợp.'));return;}
const top=node('div',undefined,'topline');top.append(node('h2',label(q)),node('span','Trang PDF '+pages(q),'tag'));box.append(top);
box.append(node('p',q.pair_status==='PAIRED_LAYOUT_CANDIDATE'?'Đã tìm thấy vùng đề và lời giải; nội dung toán học chưa được xác minh.':'Câu cần xử lý thêm: chưa đủ vùng đề hoặc lời giải.','notice'));
if(q.quality_flags.includes('POSSIBLE_SECTION_CONTEXT_ATTACHED_TO_SOLUTION'))box.append(node('p','Cần kiểm tra ranh giới: vùng lời giải có thể chứa phần mở đầu của mục tiếp theo.','notice'));
if(q.collection_source_spans){const s=node('section',undefined,'section');s.append(node('span','ĐỀ BÀI VÀ LỜI GIẢI NGUỒN','section-label'));for(const span of q.collection_source_spans)s.append(figure(span));box.append(s);}else box.append(part(q,'question','ĐỀ BÀI'),part(q,'solution','LỜI GIẢI NGUỒN'));
if(q.answer.text_raw){box.append(node('p','Nhãn đáp án trong nguồn: '+q.answer.text_raw,'answer-label'));if(!q.collection_source_spans)for(const span of q.answer.source_spans.filter(s=>s.asset_path))box.append(figure(span));}
else box.append(node('p','Không có nhãn đáp án riêng được nhận ra. Kết luận vẫn được giữ trong lời giải.','muted'));
const txt=node('details');txt.append(node('summary','Text hỗ trợ tìm kiếm · có thể mất ký hiệu'),node('pre','ĐỀ BÀI\n'+q.question.text_lossy+'\n\nLỜI GIẢI\n'+q.solution.text_lossy));box.append(txt);
const meta=node('details');meta.append(node('summary','Metadata và các mục cần kiểm tra'),node('pre',JSON.stringify(q,null,2)));box.append(meta);
const button=node('button','Tải metadata câu này','action');button.onclick=()=>download({schema_version:'paired-question/v1',source:data.source,...q},q.question_id.replaceAll(':','-')+'.json');box.append(button);
for(const b of document.querySelectorAll('.item'))b.setAttribute('aria-current',String(b.dataset.id===id));}
function filter(){const term=document.getElementById('search').value.toLocaleLowerCase().trim(),status=document.getElementById('filter').value;
const matches=qs.filter(q=>(!status||q.pair_status===status)&&(!term||(label(q)+' '+q.question.text_lossy+' '+q.solution.text_lossy).toLocaleLowerCase().includes(term)));
const list=document.getElementById('list');list.replaceChildren();document.getElementById('count').textContent=matches.length+' / '+qs.length+' câu';
for(const q of matches){const b=node('button',undefined,'item');b.dataset.id=q.question_id;b.setAttribute('aria-current',String(selected===q.question_id));b.append(node('b',label(q)+' · trang '+pages(q)),node('small',q.question.text_lossy.replace(/^\s*(Câu|Bài)\s*\d+\s*[.:)]/i,'').trim()));b.onclick=()=>choose(q.question_id);list.append(b);}
if(!matches.length){list.append(node('p','Không tìm thấy câu.','empty'));}else if(!matches.some(q=>q.question_id===selected))choose(matches[0].question_id);}
document.getElementById('source-name').textContent=data.source.name;
const stats=document.getElementById('stats'),paired=qs.filter(q=>q.pair_status==='PAIRED_LAYOUT_CANDIDATE').length;
for(const text of [data.source.page_count+' trang nguồn',qs.length+' câu ứng viên',paired+' câu có đề và lời giải','Local · không gọi model'])stats.append(node('span',text,'tag'));
document.getElementById('search').addEventListener('input',filter);document.getElementById('filter').addEventListener('change',filter);
choose(selected);filter();
</script>
</html>
