<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metadata PDF đã phân loại</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#18362f;font:15px/1.6 system-ui}header{background:white;border-bottom:1px solid #dce6e1;padding:24px 5vw}h1{margin:0;font-size:26px}a{color:#12775f}.muted{color:#61776e;font-size:13px}.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}main{max-width:1500px;margin:22px auto;padding:0 24px;display:grid;grid-template-columns:290px 1fr;gap:22px}aside,article{background:white;border:1px solid #dce6e1;border-radius:12px;padding:20px;min-width:0}aside{align-self:start;position:sticky;top:16px}select,button{font:inherit}select{width:100%;padding:10px;margin-bottom:14px;border:1px solid #cbded4;border-radius:7px}.item{display:block;width:100%;text-align:left;padding:10px;border:0;background:#f4f8f5;border-radius:7px;margin-bottom:7px;cursor:pointer;color:#18362f}.item.active{background:#d9efe2}#list{max-height:65vh;overflow:auto}.source{max-width:100%;height:auto;border:1px solid #dae5de;display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f6;padding:15px;border-radius:8px;font-size:13px}.tag{display:inline-block;border-radius:18px;background:#e8f3ed;padding:4px 12px;font-size:12px}h2{margin:10px 0}.reason{color:#795c28;background:#fff8e9;border-radius:7px;padding:12px;font-size:13px}@media(max-width:800px){main{grid-template-columns:1fr;padding:0 12px}aside{position:static}#list{max-height:180px}header{padding:20px}}</style>
<header><div class="muted">COACH LEARNING · PDF DATASET</div><h1>Metadata đã phân loại</h1><div id="summary">Đang tải…</div><div class="links"><a href="metadata.final.pretty.json" download>Metadata đầy đủ</a><a href="core_candidates.jsonl" download>Ứng viên core</a><a href="image_reference.jsonl" download>Tham khảo ảnh</a><a href="held_items.jsonl" download>Tạm loại</a><a href="summary.json">Báo cáo</a></div><p class="muted">Ứng viên core có đáp án cuối ghi rõ trong nguồn; nội dung chưa được phê duyệt học thuật. Các bước giải chưa dùng để chấm.</p></header>
<main><aside><select id="filter" aria-label="Nhóm dữ liệu"><option value="">Tất cả câu</option><option value="core_candidates">Ứng viên core</option><option value="image_reference">Tham khảo ảnh</option><option value="held_items">Tạm loại</option></select><div id="list"></div></aside><article id="detail">Chọn một câu để xem nguồn và lý do phân loại.</article></main>
<script>
const $=id=>document.getElementById(id),node=(tag,text,cls)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};let data,selected;
const labels={core_candidates:'Ứng viên core',image_reference:'Tham khảo ảnh',held_items:'Tạm loại'};
function list(){let items=data.questions.filter(q=>!$('filter').value||q.group===$('filter').value);$('list').replaceChildren();for(let q of items){let b=node('button','Mục '+q.number+' · '+labels[q.group],'item'+(selected===q.question_id?' active':''));b.onclick=()=>open(q);$('list').append(b)}if(!items.length)$('list').append(node('p','Không có câu trong nhóm này.'))}
async function open(q){selected=q.question_id;list();let response=await fetch(q.record);if(!response.ok)throw Error('Không tải được record');let row=await response.json(),box=$('detail');box.replaceChildren(node('span',labels[row.usage_group],'tag'),node('h2','Mục '+row.collection_number),node('p',row.chapter_title,'muted'));if(row.routing_reasons.length)box.append(node('p',row.routing_reasons.join(' · '),'reason'));for(let [role,title] of [['question','Đề gốc'],['solution','Lời giải gốc']]){box.append(node('h3',title));for(let f of row.parts[role].fragments){if(!/^assets\/[a-zA-Z0-9_\/-]+\.png$/.test(f.source_asset))continue;let im=node('img',undefined,'source');im.src=f.source_asset;im.alt=title+' · Trang '+f.page_number;im.loading='lazy';box.append(im)}}let details=node('details'),sum=node('summary','Xem text và metadata');details.append(sum,node('pre',JSON.stringify(row,null,2)));box.append(details)}
fetch('catalog.json').then(r=>r.json()).then(x=>{data=x;let c=x.summary.counts;$('summary').textContent=x.summary.questions+' câu · '+c.core_candidates+' ứng viên core · '+c.image_reference+' tham khảo ảnh · '+c.held_items+' tạm loại';list();if(x.questions.length)open(x.questions[0])}).catch(e=>{$('summary').textContent='Không tải được dữ liệu: '+e.message});$('filter').onchange=list;
</script></html>
