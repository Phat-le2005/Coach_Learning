<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach Learning · Đối chiếu dữ liệu toán</title>
<link rel="stylesheet" href="review-assets/katex/katex.min.css"><script defer src="review-assets/katex/katex.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.7 system-ui,"Segoe UI",sans-serif;color:#203e46;background:#f0f5f3}header{background:white;padding:18px 26px;border-bottom:1px solid #dbe6e1;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:21px;margin:0}header p{margin:2px 0 0;color:#71857f;font-size:12px}a{color:#137b60}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);height:calc(100vh - 91px)}aside{padding:16px;overflow:auto;border-right:1px solid #d6e5dc}main{overflow:auto;padding:24px}button,input{font:inherit}button{cursor:pointer}.item{display:block;width:100%;padding:12px;text-align:left;border:1px solid #d7e5df;border-radius:9px;background:white;margin-bottom:8px;color:#34554c}.item.active{background:#e3f4ea;border-color:#168164}.item small{display:block;font-size:11px;color:#73857d}input{width:100%;padding:9px;border:1px solid #cddfd4;border-radius:8px;margin-bottom:12px}.check{font-size:12px;display:block;margin-bottom:12px}.check input{width:auto;margin:0 6px 0 0}h2{font-size:23px;margin:0 0 14px}.notice,.issue{padding:12px 15px;border:1px solid #e7d7ad;border-radius:8px;background:#fff8e9;color:#806020;font-size:12px;margin-bottom:12px}.issue.error{background:#fff0ed;color:#994431;border-color:#edccc3}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.card{border:1px solid #d9e5df;border-radius:10px;background:white;overflow:hidden;margin-bottom:15px}.card h3{font-size:13px;background:#f7fbf8;margin:0;padding:12px 16px;border-bottom:1px solid #e0ebe4}.body{padding:15px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.source{width:100%;height:auto;display:block;border:1px solid #e1e9e3;margin:8px 0 18px}.tag{font-size:10px;color:#697f77}.step{padding:15px 0;border-bottom:1px solid #e3ece6}.step:last-child{border:0}.step h4{font-size:14px;margin:0 0 8px}.math{overflow:auto;padding:9px;border:1px solid #e0ebe4;border-radius:6px;margin-top:6px}.katex-display{margin:.4em 0}details{font-size:12px;color:#6c8179;cursor:pointer}pre{font:11px/1.6 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:1000px){.columns{grid-template-columns:1fr}}@media(max-width:650px){.layout{display:block;height:auto}aside{max-height:230px}main{overflow:visible;padding:14px}header{display:block}}
</style></head><body><header><div><h1>Đối chiếu dữ liệu toán</h1><p>Ảnh nguồn · Bước giải được đề xuất · Vấn đề cần kiểm tra</p></div><a href="report.json" target="_blank" rel="noopener">Báo cáo chạy</a></header><div class="layout"><aside><input id="search" placeholder="Tìm câu / cửa sổ…" aria-label="Tìm dữ liệu"><label class="check"><input id="flagged" type="checkbox">Chỉ câu có cảnh báo</label><nav id="list"></nav></aside><main id="main"></main></div>
<script id="data" type="application/json">__PAYLOAD__</script><script>
const {records,report}=JSON.parse(document.querySelector('#data').textContent);let selected=0;document.querySelector('h1').textContent=(report.provider==='local'?'Qwen local':'Gemini')+' · Đối chiếu dữ liệu toán';
function el(t,c,s){const e=document.createElement(t);if(c)e.className=c;if(s!==undefined)e.textContent=s;return e}
function math(e,t,formula=false){if(formula){try{if(window.katex){katex.render(t,e,{throwOnError:false,trust:false,maxExpand:500,maxSize:12,displayMode:true});return}}catch(err){}e.textContent=t;return}const rx=/\$\$([\s\S]*?)\$\$|\$([^$\n]+)\$/g;let at=0,m;while(m=rx.exec(t)){e.append(document.createTextNode(t.slice(at,m.index)));const s=el('span');try{if(window.katex)katex.render(m[1]??m[2],s,{throwOnError:false,trust:false,maxExpand:500,maxSize:12,displayMode:m[1]!==undefined});else s.textContent=m[0]}catch(err){s.textContent=m[0]}e.append(s);at=rx.lastIndex}e.append(document.createTextNode(t.slice(at)))}
function card(title,text){const c=el('section','card'),b=el('div','body');c.append(el('h3','',title),b);if(text!==undefined){const p=el('div','text');math(p,text);b.append(p)}return[c,b]}
function name(r){const p=r.source_package;return p.source_number!==undefined?`Câu ${p.source_number}`:`${p.document_label||'PDF'} · trang ${p.core_pages.join('–')}`}
function list(){const n=document.querySelector('#list');n.replaceChildren();records.forEach((r,i)=>{if(!name(r).toLowerCase().includes(document.querySelector('#search').value.toLowerCase())||(document.querySelector('#flagged').checked&&r.ai_review_status!=='AI_FLAGGED'))return;const b=el('button',`item${i===selected?' active':''}`,name(r));b.append(el('small','',r.ai_review_status==='AI_FLAGGED'?'Có vấn đề cần kiểm tra':'AI đã rà soát'));b.onclick=()=>{selected=i;draw()};n.append(b)})}
function issues(target,items){for(const i of items){const box=el('div',`issue${i.severity==='ERROR'?' error':''}`);box.append(el('strong','',i.code),el('div','',i.message));if(i.proposed_correction)box.append(el('div','','Đề xuất: '+i.proposed_correction));box.append(el('small','',i.evidence_ids.join(', ')));target.append(box)}}
function steps(target,items){items.forEach(s=>{const b=el('div','step');b.append(el('h4','',`${s.order}. ${s.title}`),el('div','tag',`${s.kind} · ${s.basis==='VISIBLE_SOURCE'?'Theo nguồn':'Nội dung bổ sung cần duyệt'}${s.uncertain?' · Chưa chắc chắn':''}`));const text=el('div','text');math(text,s.content_markdown);b.append(text);for(const latex of s.formulas_latex){const f=el('div','math');math(f,latex,true);b.append(f)}if(s.conditions.length)b.append(el('p','tag','Điều kiện: '+s.conditions.map(c=>c.text+(c.basis==='PROPOSED_ADDITION'?' (bổ sung)':'')).join('; ')));b.append(el('div','tag','Nguồn: '+s.evidence_ids.join(', ')));target.append(b)})}
function draw(){list();const main=document.querySelector('#main');main.replaceChildren();const r=records[selected];if(!r){main.append(el('p','','Chưa có kết quả hoàn chỉnh. Xem report.json và hàng chờ lỗi.'));return}main.append(el('h2','',name(r)),el('div','notice',`${r.model} · ${r.ai_review_status}. Đã kiểm tra cấu trúc và tham chiếu nguồn. Nội dung AI chưa phải phê duyệt học thuật hay rubric chấm.`));const cols=el('div','columns'),left=el('div'),right=el('div');cols.append(left,right);main.append(cols);if(r.result.source_transcription){const t=r.result.source_transcription;for(const [title,text]of[['Đề bài theo ảnh',t.stem_markdown],['Đáp án nguồn',t.answer_text]])left.append(card(title,text)[0]);issues(left,r.result.issues);const [c,b]=card('Các bước giải AI đề xuất');steps(b,r.result.steps);left.append(c);const[c2,b2]=card('Lời giải nguồn được chép lại');const d=el('details');d.append(el('summary','','Mở toàn bộ lời giải'));const text=el('div','text');math(text,t.solution_markdown);d.append(text);b2.append(d);left.append(c2)}else{issues(left,r.result.window_issues);for(const u of r.result.units){const[c,b]=card(`${u.kind==='QUESTION'?'Câu hỏi':'Kiến thức'} · ${u.source_label||u.title}`,u.content_markdown);if(u.source_answer)b.append(el('p','','Đáp án ghi trong nguồn: '+u.source_answer));for(const o of u.options){const text=el('div','text');math(text,`${o.label}. ${o.content_markdown}`);b.append(text)}issues(b,u.issues);steps(b,u.steps);b.append(el('div','tag',u.complete?'AI báo đủ nội dung trong cửa sổ':'Nội dung chưa đầy đủ'));left.append(c)}}for(const ref of r.source_package.references){const[c,b]=card(`${ref.evidence_id} · trang ${ref.page_number}`);const a=el('a','','Mở ảnh nguồn');a.href=ref.asset_path;a.target='_blank';a.rel='noopener';const img=el('img','source');img.src=ref.asset_path;img.alt=`Nguồn ${ref.evidence_id}`;img.loading='lazy';b.append(a,img);right.append(c)}main.scrollTop=0}
document.querySelector('#search').oninput=list;document.querySelector('#flagged').onchange=list;document.addEventListener('DOMContentLoaded',draw);
</script></body></html>
