services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edums-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: edums
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
