    const particles=Array.from({length:42},(_,i)=>({x:(i*173)%W,y:(i*97)%H,r:1+(i%4),speed:.08+(i%7)*.018,alpha:.12+(i%5)*.035}));

    function rr(x,y,w,h,r,fill,stroke=null,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
    function line(x1,y1,x2,y2,color=palette.line,lw=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();ctx.setLineDash([])}

    function text(value,x,y,size=32,color=palette.ink,weight=500,align='left',maxWidth){ctx.font=`${weight} ${size}px Inter,Segoe UI,Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';if(maxWidth)ctx.fillText(value,x,y,maxWidth);else ctx.fillText(value,x,y)}
    function wrap(value,x,y,maxWidth,lineHeight,size=30,color=palette.ink,weight=500,align='left'){
      ctx.font=`${weight} ${size}px Inter,Segoe UI,Arial`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';const words=value.split(' ');let current='',yy=y;
      for(const word of words){const test=current?`${current} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&current){ctx.fillText(current,x,yy);current=word;yy+=lineHeight}else current=test}if(current)ctx.fillText(current,x,yy);return yy;
    }
    function badge(value,x,y,kind='live'){const colors={live:[palette.mint,'#11362d'],vision:[palette.violet,'white'],proto:[palette.amber,'#30240d'],core:[palette.aqua,'#0d302f']};const [bg,fg]=colors[kind]||colors.live;ctx.font='700 18px Inter,Segoe UI,Arial';const w=ctx.measureText(value).width+34;rr(x,y,w,38,19,bg);text(value,x+17,y+26,18,fg,700);return w}

    }
    function drawBg(t,dark=false){
      const grad=ctx.createLinearGradient(0,0,W,H);if(dark){grad.addColorStop(0,'#071f1a');grad.addColorStop(.55,'#10392f');grad.addColorStop(1,'#173247')}else{grad.addColorStop(0,'#e9f7ef');grad.addColorStop(.5,palette.cream);grad.addColorStop(1,'#e2f0ef')}ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
      particles.forEach((p,i)=>{const yy=(p.y+t*p.speed*60)%H;circle(p.x,yy,p.r,dark?`rgba(156,224,188,${p.alpha})`:`rgba(216,161,67,${p.alpha})`)});
      ctx.globalAlpha=.22;circle(1600+Math.sin(t*.12)*80,130,280,dark?'#3bb9b0':'#b9ebe5');circle(210,920,340,dark?'#205344':'#dcefe5');ctx.globalAlpha=1;
    }
    function drawScreenshot(img,key,t,sceneStart,zoomFrom=1,zoomTo=1.04){
      if(!img)return;const p=clamp((t-sceneStart)/(scenes.find(s=>s.start===sceneStart)?.end-sceneStart||1));const z=zoomFrom+(zoomTo-zoomFrom)*ease(p);const sw=img.width/z,sh=img.height/z;const sx=(img.width-sw)*(.5+.08*Math.sin(p*Math.PI));const sy=(img.height-sh)*.5;ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
      const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'rgba(7,31,26,.05)');gradient.addColorStop(.65,'rgba(7,31,26,0)');gradient.addColorStop(1,'rgba(7,31,26,.2)');ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
    }
    function cursor(x,y,click=false){ctx.save();ctx.translate(x,y);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,31);ctx.lineTo(8,23);ctx.lineTo(17,39);ctx.lineTo(24,35);ctx.lineTo(15,19);ctx.lineTo(27,18);ctx.closePath();ctx.fillStyle='white';ctx.shadowColor='#102e26aa';ctx.shadowBlur=9;ctx.fill();ctx.strokeStyle=palette.forest;ctx.lineWidth=2;ctx.stroke();ctx.restore();if(click){ctx.globalAlpha=.45;circle(x,y,30,'transparent',palette.mint,4);ctx.globalAlpha=1}}
    function footerCaption(t){
      const item=captions.find(([a,b])=>t>=a&&t<b);if(!item)return;const [,b,value]=item;const fade=clamp(Math.min((t-item[0])/1.1,(b-t)/1.1));ctx.globalAlpha=fade;rr(250,934,1420,104,28,'rgba(7,31,26,.9)','rgba(156,224,188,.24)');wrap(value,960,980,1320,34,26,'white',600,'center');ctx.globalAlpha=1;
    }
    function drawCover(t){drawBg(t,true);ctx.globalAlpha=.55;for(let i=0;i<7;i++){const a=i*Math.PI*2/7+t*.05;line(960,525,960+Math.cos(a)*260,525+Math.sin(a)*190,'rgba(99,201,154,.35)',3);circle(960+Math.cos(a)*260,525+Math.sin(a)*190,13,i%2?palette.sky:palette.mint)}ctx.globalAlpha=1;circle(960,525,94,'rgba(99,201,154,.15)',palette.mint,3);circle(960,525,55,palette.mint);text('E',960,546,58,palette.deep,900,'center');badge('EDUMS · LEARNING GARDEN',110,90,'live');text('Hệ sinh thái học tập',960,280,68,'white',800,'center');text('cá nhân hóa cho học sinh lớp 12',960,357,48,'#c3edd5',600,'center');text('AI-Native · Evidence-Based · Human-Guided',960,735,24,'#9ce0bc',700,'center');progress(610,806,700,clamp(t/18),palette.mint)}
    function drawLogin(t){drawScreenshot(images.login,'login',t,18,1,1.035);badge('LIVE DEMO',110,142,'live');const p=clamp((t-22)/13);cursor(1220+Math.sin(p*Math.PI)*180,520+p*170,t>35&&t<36.5);if(t>33){ctx.globalAlpha=clamp((t-33)/2);rr(1140,638,360,52,26,'rgba(99,201,154,.94)');text('Đang xác thực vai trò STUDENT…',1320,671,19,palette.deep,700,'center');ctx.globalAlpha=1}}
    function drawHome(t){drawScreenshot(images.home,'home',t,42,1,1.055);badge('LIVE DEMO',110,142,'live');const p=clamp((t-47)/20);cursor(620+p*220,622-p*20,t>65&&t<66.5);if(t>58){ctx.globalAlpha=.88;rr(1330,690,420,150,28,'rgba(251,250,244,.94)');text('Hành động ưu tiên',1370,738,18,palette.muted,700);text('Giải bất phương trình',1370,783,27,palette.ink,800);badge('PREREQUISITE_REPAIR',1370,805,'core');ctx.globalAlpha=1}}
    function drawGalaxy(t){drawScreenshot(images.galaxy,'galaxy',t,68,1,1.18);badge('LIVE DEMO',110,142,'live');const local=t-68;if(local>7){ctx.globalAlpha=clamp((local-7)/2);rr(1320,750,470,135,28,'rgba(251,250,244,.95)');text('Dạng bài được chọn',1360,795,17,palette.muted,700);text('Tham số và tính đơn điệu',1360,839,25,palette.ink,800);text('NOT_STARTED · 0 lượt luyện tập',1360,870,16,palette.verdant,700);ctx.globalAlpha=1}cursor(850+Math.sin(local*.23)*480,760+Math.cos(local*.18)*110,local%8<1)}
    function workspaceShell(active='Luyện tập'){drawBg(0,false);topNav(active);rr(74,134,1772,856,34,'rgba(251,250,244,.94)','rgba(29,75,61,.13)');}

    function drawPractice(t){workspaceShell();titleBlock(scenes[4]);rr(108,258,690,668,28,'#f7f7ef',palette.line);badge('DẠNG BÀI · TÍNH ĐƠN ĐIỆU',140,292,'core');text('Câu 3 / 10',686,320,18,palette.muted,700,'right');wrap('Cho hàm số  f(x) = x³ − 3mx² + 3(m² − 1)x + 1.',140,382,610,44,30,palette.ink,700);wrap('Tìm tất cả giá trị của m để hàm số đồng biến trên ℝ.',140,468,610,42,28,palette.ink,600);rr(140,550,610,70,18,'white',palette.line);text('A.  m ≤ −1',172,594,23,palette.ink,600);rr(140,638,610,70,18,'white',palette.line);text('B.  −1 ≤ m ≤ 1',172,682,23,palette.ink,600);rr(140,726,610,70,18,'#e3f7eb',palette.mint,2);text('C.  m ≥ 1',172,770,23,palette.forest,800);rr(140,814,610,70,18,'white',palette.line);text('D.  m ∈ ℝ',172,858,23,palette.ink,600);
      rr(830,258,980,668,28,'white',palette.line);text('Không gian lời giải',872,312,25,palette.ink,800);['✎ Bút','T Công thức','△ Hình học','↶ Hoàn tác','⌫ Xóa'].forEach((x,i)=>{rr(872+i*170,336,154,48,16,i===0?'#dcefe5':'#f4f5ef',palette.line);text(x,949+i*170,367,16,palette.ink,700,'center')});line(872,418,1766,418,palette.line,2);

    function drawInkGeometry(t){
      workspaceShell();titleBlock(scenes[5]);const local=t-124;
      rr(108,258,570,668,28,'#f7f7ef',palette.line);badge('HÌNH HỌC OXYZ',140,292,'vision');
      wrap('Nhập công thức hoặc viết trực tiếp để dựng mô hình hình học.',140,382,500,40,26,palette.ink,750);
      rr(140,448,506,108,20,'white',palette.line);text('A = (1; 2; 0)',170,488,23,palette.forest,700);text('B = (4; −1; 3)   ·   M = (A + B) / 2',170,530,21,palette.forest,700);
      text('Lớp hiển thị',140,604,20,palette.ink,800);['Vector AB','Điểm & nhãn','Mặt phẳng Oxy','Khoảng cách'].forEach((s,i)=>{const y=636+i*62;rr(140,y,506,48,16,i<3?'#e3f7eb':'white',palette.line);circle(168,y+24,9,i<3?palette.mint:'#d8e2dc');text(s,194,y+31,18,palette.ink,650)});
      rr(708,258,1102,668,28,'#0d342c','rgba(156,224,188,.25)');text('Trình xem hình học 3D',750,312,25,'white',800);badge('XOAY CAMERA',1460,286,'core');text(`${Math.round((local*13)%360)}°`,1728,312,18,'#bfe8d4',800,'right');
      const cx=1280,cy=630,scale=74,angle=local*.13,ca=Math.cos(angle),sa=Math.sin(angle);
      const project=(p)=>{const rx=p[0]*ca-p[1]*sa,ry=p[0]*sa+p[1]*ca;return{x:cx+(rx-ry*.55)*scale,y:cy+((rx+ry)*.20-p[2])*scale}};
      ctx.globalAlpha=.22;for(let i=-3;i<=4;i++){const a=project([i,-3,0]),b=project([i,4,0]),c=project([-3,i,0]),d=project([4,i,0]);line(a.x,a.y,b.x,b.y,'#8cd8bd',1);line(c.x,c.y,d.x,d.y,'#8cd8bd',1)}ctx.globalAlpha=1;
