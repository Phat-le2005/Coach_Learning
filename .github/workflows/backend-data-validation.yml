name: Backend Data and Application Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-data-and-curriculum:
    name: Curriculum & Question Data Integrity Gates (DATA-032 to DATA-050)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Read-Only Data Validation Tests (No Database Required)
        run: |
          pytest tests/curriculum/ tests/questions/ -v --tb=short

  validate-application:
    name: Backend Full Application Regression
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_NAME: edums_test
      DATABASE_USER: edums_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API v1 contract
        run: |
          python -m app.api.check_contract

      - name: Run full backend regression tests
        run: |
          pytest tests/ -v --tb=short

  validate-ocr-raster:
    name: Free OCR Pillow Image Contract (CPU, no model download)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_NAME: edums_test
      DATABASE_USER: edums_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend and Pillow (not ONNX or PyTorch)
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'Pillow>=10,<12'
      - name: Verify real raster images and adapter behavior without downloaded weights
        run: |
          pytest -q -rs --tb=short tests/math_solutions/test_local_render.py tests/math_solutions/test_local_pix2tex_adapter.py tests/math_solutions/test_local_rapid_adapter.py
