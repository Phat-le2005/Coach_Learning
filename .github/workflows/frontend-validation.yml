name: Frontend Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-frontend:
    name: Frontend Tests, Typecheck and Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: http://127.0.0.1:8000
      AUTH_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      SESSION_COOKIE_SECURE: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Next types and typecheck
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm run test

      - name: LAN discovery, origin policy and ink preservation
        run: npm run test:lan

      - name: OCR Lab contracts (no private fixtures or model downloads)
        run: npm run test:ocr-lab

      - name: Local model setup portability (no inference)
        working-directory: .
        run: python3 -m unittest discover -s tools/ocr-v2-lab -p test_portable_setup.py

      - name: Production build
        run: npm run build
