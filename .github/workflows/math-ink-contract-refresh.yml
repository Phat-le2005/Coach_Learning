name: Math Ink Contract Snapshot Refresh

on:
  push:
    branches:
      - feat/step-math-ink-01-hybrid-storage
    paths:
      - .github/workflows/math-ink-contract-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Rebuild canonical OpenAPI V2
        working-directory: backend
        run: |
          python -m app.api.v2.export_contract
          python -m app.api.v2.check_contract
      - name: Commit exact generated schema and checksum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/contracts/openapi-v2.json backend/contracts/openapi-v2.sha256
          if ! git diff --cached --quiet; then
            git commit -m "chore(math-ink): regenerate canonical OpenAPI v2 snapshot"
            git push origin HEAD:feat/step-math-ink-01-hybrid-storage
          fi
